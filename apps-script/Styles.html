<style>
/* ==========================================================================
   Nmbrs Groei Scan · huisstijl
   Bron: Nmbrs Brand Guidelines (16-09-2026) en Digital Stylesheet (08-07-2026)
   Primair: White, Blurple #6B5DFF, Midnight #010149, Dark Blue #00001D
   Secundair: Lavender #E7E5FF, Off-White #FFFBF4. Coral #FE6E63 alleen voor
   primaire knoppen en kleine labels, altijd met Dark Blue tekst.
   Display: Stratos Bold (fallback Barlow ExtraBold), -2%, regelhoogte 95%.
   Tekst: Inter. Iconen: Material Symbols Outlined, Regular.
   ========================================================================== */
:root {
  --white: #FFFFFF;
  --blurple: #6B5DFF;
  --blurple-dark: #5446F0;
  --blurple-300: #A9A1FF;
  --midnight: #010149;
  --dark: #00001D;
  --lavender: #E7E5FF;
  --lavender-50: #F4F3FF;
  --offwhite: #FFFBF4;
  --coral: #FE6E63;
  --coral-dark: #F2554A;
  --text: var(--dark);
  --text-soft: #3A3A55;
  --text-muted: #5B5B74;
  --line: #DCDAF5;
  --line-strong: #C3BFF5;
  --ok: #157A4E;
  --font-display: 'Stratos', 'Barlow', 'Arial Narrow', sans-serif;
  --font-body: 'Inter', 'Segoe UI', Arial, sans-serif;
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
  --shadow-sm: 0 1px 2px rgba(0, 0, 29, .05), 0 4px 14px rgba(1, 1, 73, .06);
  --shadow-md: 0 14px 40px rgba(1, 1, 73, .16);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --topbar-h: 68px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--offwhite); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 3px solid var(--blurple); outline-offset: 2px; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

.display { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; line-height: .95; }
.d-xl { font-size: clamp(48px, 6.4vw, 96px); }
.d-l { font-size: clamp(40px, 5vw, 76px); }
.d-m { font-size: clamp(34px, 4vw, 60px); }
.d-s { font-size: clamp(28px, 3.2vw, 48px); }
.d-xs { font-size: clamp(24px, 2.6vw, 36px); }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--blurple-dark); }
.sub-l { font-weight: 700; font-size: 24px; line-height: 1.1; }
.sub-m { font-weight: 700; font-size: 20px; line-height: 1.1; }
.lede { font-size: 18px; color: var(--text-soft); max-width: 68ch; line-height: 1.4; }
.muted { color: var(--text-muted); font-size: 14px; }
.u-line { text-decoration: underline; text-decoration-color: var(--blurple); text-decoration-thickness: .12em; text-underline-offset: .1em; text-decoration-skip-ink: none; }

.ms { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; font-feature-settings: 'liga'; font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; font-size: 22px; }

/* Logo */
.logo { display: inline-block; line-height: 0; }
.logo svg { height: 100%; width: auto; display: block; }
.logo .sym { fill: var(--blurple); }
.logo .word { fill: var(--dark); }
.logo.inverse .word { fill: var(--white); }
.logo.mono .sym, .logo.mono .word { fill: var(--dark); }

/* Knoppen (Digital Stylesheet) */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 20px; border-radius: 999px; border: 1.5px solid transparent; font-weight: 600; font-size: 15px; line-height: 1.6; text-decoration: none; white-space: nowrap; transition: transform .2s var(--ease), background-color .2s, border-color .2s, color .2s, box-shadow .2s; background: none; }
.btn .ms { font-size: 20px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--coral); color: var(--dark); }
.btn-primary:hover:not(:disabled) { background: var(--coral-dark); transform: translateY(-3px); }
.btn-dark { background: var(--dark); color: var(--white); }
.btn-dark:hover:not(:disabled) { background: var(--blurple); transform: translateY(-3px); }
.btn-secondary { border-color: var(--midnight); color: var(--midnight); }
.btn-secondary:hover:not(:disabled) { background: var(--midnight); color: var(--white); box-shadow: 0 0 0 4px var(--lavender); }
.btn-tertiary { padding: 4px 0; border-radius: 0; color: var(--dark); background-image: linear-gradient(var(--dark), var(--dark)), linear-gradient(var(--lavender), var(--lavender)); background-size: 100% 1.5px, 0 40%; background-position: 0 100%, 0 100%; background-repeat: no-repeat; transition: background-size .25s var(--ease); }
.btn-tertiary:hover:not(:disabled) { background-size: 100% 1.5px, 100% 40%; }
.btn-lg { padding: 12px 26px; font-size: 17px; }
.btn-sm { padding: 5px 14px; font-size: 14px; }
.btn .arrow { transition: transform .2s var(--ease); }
.btn:hover .arrow { transform: translateX(3px); }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--white); display: inline-flex; align-items: center; justify-content: center; transition: border-color .15s, background .15s; }
.icon-btn:hover { border-color: var(--blurple); background: var(--lavender-50); }

/* Formulieren */
.field { display: grid; gap: 6px; }
.field > label, .field > .label { font-size: 14px; font-weight: 700; }
.field .hint { font-size: 13px; color: var(--text-muted); }
.input { width: 100%; padding: 11px 16px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--white); font-size: 16px; transition: border-color .15s, box-shadow .15s; }
.input:focus { outline: none; border-color: var(--blurple); box-shadow: 0 0 0 4px var(--lavender); }
.input[aria-invalid="true"] { border-color: var(--coral-dark); box-shadow: 0 0 0 3px rgba(254, 110, 99, .18); }
.input-group { display: flex; align-items: stretch; border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--white); overflow: hidden; transition: border-color .15s, box-shadow .15s; }
.input-group:focus-within { border-color: var(--blurple); box-shadow: 0 0 0 4px var(--lavender); }
.input-group .input { border: none; border-radius: 0; box-shadow: none !important; min-width: 0; }
.input-group .affix { display: flex; align-items: center; padding: 0 12px; color: var(--text-muted); font-size: 14px; background: var(--lavender-50); white-space: nowrap; }
.grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 18px; }

/* Topbar */
#topbar { position: sticky; top: 0; z-index: 40; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 10px max(24px, env(safe-area-inset-left)); min-height: var(--topbar-h); background: rgba(255, 255, 255, .92); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.tb-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
#topbar .logo { height: 26px; cursor: pointer; }
.client-tag { display: inline-flex; align-items: center; gap: 6px; max-width: 240px; font-size: 14px; font-weight: 600; color: var(--midnight); padding: 5px 12px; border-radius: 999px; background: var(--lavender); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.client-tag .ms { font-size: 18px; }
.steps { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; justify-content: flex-start; }
.steps > :first-child { margin-left: auto; }
.steps > :last-child { margin-right: auto; }
.steps::-webkit-scrollbar { display: none; }
.step { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--text-muted); padding: 5px 12px 5px 5px; border-radius: 999px; background: transparent; border: none; white-space: nowrap; transition: background .15s, color .15s; }
.step-num { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 999px; border: 1.5px solid var(--line-strong); color: var(--midnight); font-family: var(--font-display); font-weight: 800; font-size: 14px; }
.step:hover { background: var(--lavender-50); color: var(--dark); }
.step.done .step-num { background: var(--lavender); border-color: var(--lavender); }
.step.active { background: var(--lavender); color: var(--dark); }
.step.active .step-num { background: var(--blurple); border-color: var(--blurple); color: var(--dark); }
.tb-right { display: flex; align-items: center; gap: 10px; }
.save-status { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
.save-status .ms { font-size: 19px; }
.save-status.ok .ms { color: var(--blurple); }
.save-status.err .ms { color: var(--coral-dark); }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 2px; background: var(--white); }
.lang button { border: none; background: none; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; color: var(--text-muted); }
.lang button[aria-pressed="true"] { background: var(--dark); color: var(--white); }
.avatar { width: 34px; height: 34px; border-radius: 999px; background: var(--blurple); color: var(--dark); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }

/* Views */
main { min-height: calc(100vh - var(--topbar-h)); }
.view { animation: viewIn .5s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(18px) skewY(1deg); } to { opacity: 1; transform: none; } }
.wrap { max-width: 1240px; margin: 0 auto; padding: 44px max(24px, env(safe-area-inset-left)) 96px; }
.wrap-narrow { max-width: 880px; }
.page-head { display: grid; gap: 12px; margin-bottom: 28px; }
.page-head .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.card { background: var(--white); border-radius: var(--r-lg); padding: 28px; box-shadow: var(--shadow-sm); }
.card-tint { background: var(--lavender); border-radius: var(--r-lg); padding: 28px; }
.card-dark { background: var(--midnight); color: var(--white); border-radius: var(--r-lg); padding: 28px; position: relative; overflow: hidden; }
.card-dark .muted, .card-dark .lede { color: var(--lavender); }
.stack { display: grid; gap: 18px; }
.nav-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 32px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--lavender); color: var(--dark); white-space: nowrap; }
.chip.coral { background: var(--coral); }
.chip.dark { background: var(--midnight); color: var(--white); }
.chip.blurple { background: var(--blurple); color: var(--dark); }
.chip.ok { background: #DDF3E8; color: var(--ok); }

/* N-vorm (patroon) */
.nshape { position: absolute; pointer-events: none; display: block; }
.nshape svg { width: 100%; height: 100%; display: block; }
.nshape path { fill: var(--c, var(--blurple)); }

/* Laden */
.loader { display: grid; place-items: center; gap: 14px; padding: 80px 0; color: var(--text-muted); }
.loader svg { width: 72px; }
.loader .fill { animation: loadfill 1.4s ease-in-out infinite; }
@keyframes loadfill { 0% { clip-path: inset(0 100% 0 0); } 60%, 100% { clip-path: inset(0 0 0 0); } }

/* ---------------- Start ---------------- */
.start { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); background: var(--white); }
.start-left { padding: 56px clamp(24px, 5vw, 80px); display: grid; align-content: center; gap: 22px; }
.start-right { position: relative; overflow: hidden; background: var(--blurple); padding: 56px clamp(24px, 4vw, 64px); display: grid; align-content: center; gap: 14px; }
.start-right .nshape path { fill: var(--midnight); }
.journey { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; position: relative; z-index: 1; }
.journey li { display: grid; grid-template-columns: 52px 1fr; gap: 16px; align-items: center; background: var(--white); border-radius: var(--r-md); padding: 16px 18px; box-shadow: 0 14px 34px rgba(1, 1, 73, .18); opacity: 0; transform: translateY(18px) skewY(1.5deg); animation: stepIn .6s var(--ease) forwards; }
.journey li:nth-child(2) { animation-delay: .08s; } .journey li:nth-child(3) { animation-delay: .16s; } .journey li:nth-child(4) { animation-delay: .24s; }
@keyframes stepIn { to { opacity: 1; transform: none; } }
.journey .n { font-family: var(--font-display); font-weight: 800; font-size: 42px; line-height: .9; color: var(--blurple); }
.journey b { display: block; font-size: 16px; margin-bottom: 3px; }
.journey span { font-size: 14px; color: var(--text-soft); }
.domain-pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 12px; }
.domain-card { position: relative; text-align: left; background: var(--white); border: 2px solid var(--line); border-radius: var(--r-md); padding: 16px 16px 14px; display: grid; gap: 6px; transition: border-color .15s, transform .2s var(--ease), background .15s; }
.domain-card:hover { transform: translateY(-3px); border-color: var(--line-strong); }
.domain-card[aria-pressed="true"] { border-color: var(--blurple); background: var(--lavender-50); }
.domain-card .check { position: absolute; right: 12px; top: 12px; width: 26px; height: 26px; border-radius: 999px; border: 1.5px solid var(--line-strong); display: grid; place-items: center; color: transparent; background: var(--white); }
.domain-card[aria-pressed="true"] .check { background: var(--blurple); border-color: var(--blurple); color: var(--dark); }
.domain-card .check .ms { font-size: 18px; font-variation-settings: 'FILL' 0, 'wght' 600; }
.domain-card b { font-size: 16px; padding-right: 30px; }
.domain-card small { color: var(--text-muted); font-size: 13px; }
.domain-card .dot { width: 12px; height: 12px; border-radius: 4px; }
.resume { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--r-md); background: var(--lavender); }
.resume .ms { color: var(--blurple-dark); font-size: 26px; }
.resume div { flex: 1 1 200px; font-size: 15px; }

/* ---------------- Home (consultant) ---------------- */
.home-hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 28px; }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
.kpi { background: var(--white); border-radius: var(--r-lg); padding: 20px 22px; box-shadow: var(--shadow-sm); display: grid; gap: 6px; }
.kpi .v { font-family: var(--font-display); font-weight: 800; font-size: clamp(36px, 4vw, 54px); line-height: .95; letter-spacing: -0.02em; }
.kpi .l { font-size: 14px; color: var(--text-soft); }
.kpi.accent .v { color: var(--blurple); }
.scan-table { width: 100%; border-collapse: collapse; background: var(--white); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
.scan-table th, .scan-table td { text-align: left; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 15px; }
.scan-table th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); background: var(--lavender-50); }
.scan-table tr:last-child td { border-bottom: none; }
.scan-table tbody tr { cursor: pointer; transition: background .12s; }
.scan-table tbody tr:hover { background: var(--lavender-50); }
.table-wrap { overflow-x: auto; border-radius: var(--r-lg); }

/* ---------------- Scan ---------------- */
.scan-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.scan-nav { position: sticky; top: calc(var(--topbar-h) + 20px); background: var(--white); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--shadow-sm); max-height: calc(100vh - var(--topbar-h) - 40px); overflow: auto; }
.sn-domain { margin-bottom: 10px; }
.sn-domain > b { display: flex; align-items: center; gap: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); padding: 6px 8px; }
.sn-domain > b i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sn-sub { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; text-align: left; padding: 8px 10px; border-radius: 10px; border: none; background: none; font-size: 14px; color: var(--text-soft); }
.sn-sub:hover { background: var(--lavender-50); }
.sn-sub.active { background: var(--lavender); color: var(--dark); font-weight: 700; }
.sn-sub .cnt { font-size: 12px; font-weight: 700; color: var(--text-muted); }
.sn-sub.done .cnt { color: var(--blurple-dark); }
.sn-dots { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 10px 8px; }
.sn-dots button { width: 14px; height: 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--white); padding: 0; }
.sn-dots button.answered { background: var(--blurple-300); border-color: var(--blurple-300); }
.sn-dots button.current { box-shadow: 0 0 0 2px var(--dark); }
.scan-main { display: grid; gap: 16px; min-width: 0; }
.scan-progress { height: 6px; border-radius: 999px; background: var(--lavender); overflow: hidden; }
.scan-progress i { display: block; height: 100%; background: var(--blurple); border-radius: 999px; transition: width .45s var(--ease); }
.q-card { background: var(--white); border-radius: var(--r-lg); padding: clamp(22px, 3vw, 40px); box-shadow: var(--shadow-sm); display: grid; gap: 22px; min-height: 380px; align-content: start; position: relative; overflow: hidden; }
.q-card.enter { animation: qIn .45s var(--ease); }
@keyframes qIn { from { opacity: 0; transform: translateY(16px) skewY(1deg); } to { opacity: 1; transform: none; } }
.q-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.q-text { font-family: var(--font-display); font-weight: 800; font-size: clamp(26px, 3.2vw, 42px); line-height: 1.02; letter-spacing: -0.015em; max-width: 26ch; }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.scale button { border: 2px solid var(--line); background: var(--offwhite); border-radius: 16px; padding: 14px 6px 12px; display: grid; gap: 6px; justify-items: center; align-content: start; transition: transform .2s var(--ease), border-color .15s, background .15s; min-height: 96px; }
.scale button:hover { transform: translateY(-3px); border-color: var(--blurple); }
.scale .n { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; }
.scale small { font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.2; }
.scale button[aria-pressed="true"] { background: var(--blurple); border-color: var(--blurple); color: var(--dark); transform: translateY(-3px); }
.scale button[aria-pressed="true"] small { color: var(--dark); }
.scale button.pop { animation: pop .3s var(--ease); }
@keyframes pop { 50% { transform: translateY(-6px) scale(1.04); } }
.q-tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--text-muted); }
.kbd { display: inline-block; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; font-size: 12px; font-weight: 600; background: var(--white); color: var(--text-soft); }
.q-solution { background: var(--lavender-50); border-radius: var(--r-md); padding: 16px 18px; display: grid; gap: 6px; font-size: 15px; color: var(--text-soft); }
.q-solution b { color: var(--dark); }
.q-note textarea { width: 100%; min-height: 70px; resize: vertical; }
.q-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.q-bench { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-muted); }
.q-bench b { color: var(--dark); }
.scan-side { position: sticky; top: calc(var(--topbar-h) + 20px); display: grid; gap: 14px; }
.side-card { background: var(--white); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow-sm); display: grid; gap: 10px; }
.switch { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 40px; height: 24px; border-radius: 999px; background: var(--line-strong); position: relative; margin: 0; cursor: pointer; transition: background .2s; }
.switch input::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 999px; background: var(--white); transition: transform .2s var(--ease); }
.switch input:checked { background: var(--blurple); }
.switch input:checked::after { transform: translateX(16px); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-soft); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 999px; margin-right: 6px; vertical-align: -1px; }
.done-banner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; background: var(--midnight); color: var(--white); border-radius: var(--r-lg); padding: 18px 22px; }

/* ---------------- Resultaten ---------------- */
.res-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; margin-bottom: 24px; align-items: stretch; }
.res-total { background: var(--blurple); border-radius: var(--r-lg); padding: 32px; position: relative; overflow: hidden; display: grid; gap: 18px; align-content: start; }
