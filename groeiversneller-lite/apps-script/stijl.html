<style>
/* ==========================================================================
   Groeiversneller - Nmbrs huisstijl
   Bron: Nmbrs Brand Guidelines (16-09-2026) en Digital Stylesheet (08-07-2026)

   Primair      White #FFFFFF · Blurple #6B5DFF · Midnight Blue #010149 · Dark Blue #00001D
   Secundair    Lavender #E7E5FF · Off-White #FFFBF4
   CTA/accent   Coral #FE6E63 - alleen primaire knoppen en kleine highlight-labels,
                altijd met Dark Blue tekst (Inter SemiBold). Op Blurple: Dark Blue knop.
   Typografie   Display: Stratos Bold (-2%, lh 95%), fallback Barlow Extra Bold.
                Tekst: Inter. Eyebrow Inter Regular, subkop Inter Bold, body 130%.
   Logo         Duotone (Blurple symbool + Dark Blue woordmerk) op licht; inverse
                (Blurple + wit) op donker; Dark Blue monotone op Blurple.
                Nooit wit op Blurple. Blurple altijd ergens aanwezig.
   Vormtaal     N-vormen (rond/scherp) als patroon; pill-knoppen met opwaartse
                hover; hoekradius = 4% van de kortste zijde; grote cijfers.
   Iconen       Google Material Symbols, Regular (400), outlined.
   ========================================================================== */

:root {
  --white: #FFFFFF;
  --blurple: #6B5DFF;
  --blurple-dark: #5446F0;
  --blurple-300: #A9A1FF;
  --midnight: #010149;
  --dark: #00001D;
  --lavender: #E7E5FF;
  --lavender-50: #F4F3FF;
  --offwhite: #FFFBF4;
  --coral: #FE6E63;
  --coral-dark: #F2554A;

  --text: var(--dark);
  --text-soft: #3A3A55;   /* Dark Blue, 78% - AAA op wit */
  --text-muted: #5B5B74;
  --line: #DCDAF5;
  --line-strong: #C3BFF5;

  --font-display: 'Stratos', 'Barlow', 'Arial Narrow', sans-serif;
  --font-body: 'Inter', 'Segoe UI', Arial, sans-serif;

  --r-lg: 20px;
  --r-md: 12px;
  --r-sm: 8px;

  --shadow-sm: 0 1px 2px rgba(0, 0, 29, 0.05), 0 4px 14px rgba(1, 1, 73, 0.06);
  --shadow-md: 0 14px 40px rgba(1, 1, 73, 0.16);
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0;
  background: var(--offwhite);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px; line-height: 1.3;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; color: inherit; }
h1, h2, h3, h4 { margin: 0; color: var(--text); }
:focus-visible { outline: 3px solid var(--blurple); outline-offset: 2px; }
.hidden { display: none !important; }

/* Typografie (modulaire schaal 1.25) */
.display {
  font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; line-height: .95;
}
.display-xl { font-size: clamp(48px, 6.4vw, 96px); }
.display-l  { font-size: clamp(42px, 5vw, 76px); }
.display-m  { font-size: clamp(36px, 4vw, 60px); }
.display-s  { font-size: clamp(30px, 3.2vw, 48px); }
.display-xs { font-size: clamp(26px, 2.6vw, 36px); }
.sub-l { font-weight: 700; font-size: 24px; line-height: 1.1; }
.sub-m { font-weight: 700; font-size: 20px; line-height: 1.1; }
.eyebrow { font-weight: 400; font-size: 16px; line-height: 1.1; color: var(--text-soft); margin: 0 0 14px; }
.body-l { font-size: 20px; line-height: 1.3; }
.label { font-size: 12px; line-height: 1.3; }
.u-line { /* Merk-underline: dik, in contrastkleur */
  text-decoration: underline; text-decoration-color: var(--blurple);
  text-decoration-thickness: .12em; text-underline-offset: .1em; text-decoration-skip-ink: none;
}

.material-symbols-outlined {
  font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; line-height: 1;
  letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr;
  -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  font-size: 22px;
}

/* Logo (inline SVG) */
.logo { display: inline-block; line-height: 0; }
.logo svg { height: 100%; width: auto; display: block; }
.logo .sym { fill: var(--blurple); }
.logo .word { fill: var(--dark); }
.logo.inverse .word { fill: var(--white); }
.logo.mono .sym, .logo.mono .word { fill: var(--dark); }

/* N-vorm (patroon) */
.nshape { position: absolute; pointer-events: none; display: block; }
.nshape svg { width: 100%; height: 100%; display: block; }
.nshape path { fill: var(--c, var(--blurple)); }

/* ---------------------------------------------------------------- */
/* BUTTONS (Digital Stylesheet)                                     */
/* ---------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 7px 20px; border-radius: 999px; border: 1.5px solid transparent;
  font-family: var(--font-body); font-weight: 600; font-size: 16px; line-height: 1.7;
  text-decoration: none; white-space: nowrap;
  transition: transform .2s var(--ease), background-color .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease;
}
.btn .material-symbols-outlined { font-size: 20px; }
.btn .arrow { font-size: 20px; transition: transform .2s var(--ease); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
/* Primair: Coral + Dark Blue tekst, opwaartse hover (geïnspireerd op de N) */
.btn-primary { background: var(--coral); color: var(--dark); }
.btn-primary:hover:not(:disabled) { background: var(--coral-dark); transform: translateY(-3px); }
.btn-primary:hover:not(:disabled) .arrow { transform: translateX(3px); }
/* Primair op Blurple: Dark Blue + wit */
.btn-dark { background: var(--dark); color: var(--white); }
.btn-dark:hover:not(:disabled) { background: var(--midnight); transform: translateY(-3px); }
/* Secundair: outline Midnight, vult op hover met Blurple-ring */
.btn-secondary { background: transparent; border-color: var(--midnight); color: var(--midnight); }
.btn-secondary:hover:not(:disabled) { background: var(--midnight); color: var(--white); box-shadow: 0 0 0 4px var(--lavender); }
.btn-icon { padding: 7px 9px; }
/* Tertiair: underline met Blurple-highlight */
.btn-tertiary {
  background: none; border: none; padding: 4px 0; border-radius: 0; color: var(--dark); font-weight: 600;
  background-image: linear-gradient(var(--dark), var(--dark)), linear-gradient(var(--lavender), var(--lavender));
  background-size: 100% 1.5px, 0 40%; background-position: 0 100%, 0 100%; background-repeat: no-repeat;
  transition: background-size .25s var(--ease);
}
.btn-tertiary:hover:not(:disabled) { background-size: 100% 1.5px, 100% 40%; }
.btn-lg { padding: 11px 26px; font-size: 17px; }

/* ---------------------------------------------------------------- */
/* TOPBAR                                                           */
/* ---------------------------------------------------------------- */
#topbar {
  position: sticky; top: 0; z-index: 40;
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 24px;
  padding: 12px 40px; min-height: 68px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-left { display: flex; align-items: center; gap: 18px; min-width: 0; }
#topbar .logo { height: 24px; }
.client-tag {
  display: inline-flex; align-items: center; gap: 6px; max-width: 260px;
  font-size: 14px; font-weight: 600; color: var(--midnight);
  padding: 5px 12px; border-radius: 999px; background: var(--lavender);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.client-tag .material-symbols-outlined { font-size: 18px; }

.steps { display: flex; justify-content: center; gap: 4px; }
.step {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 600; color: var(--text-muted);
  padding: 6px 14px 6px 6px; border-radius: 999px; background: transparent; border: none;
  transition: background .15s ease, color .15s ease;
}
.step-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: 999px;
  border: 1.5px solid var(--line-strong); color: var(--midnight);
  font-family: var(--font-display); font-weight: 800; font-size: 14px;
  transition: all .15s ease;
}
.step:hover { background: var(--lavender-50); color: var(--dark); }
.step-done .step-num { background: var(--lavender); border-color: var(--lavender); }
.step-active { background: var(--lavender); color: var(--dark); }
.step-active .step-num { background: var(--blurple); border-color: var(--blurple); color: var(--dark); }

.mini-gauge { display: flex; align-items: center; gap: 10px; }
.mini-gauge svg { width: 42px; height: 42px; transform: rotate(-90deg); }
.mini-gauge-bg { fill: none; stroke: var(--lavender); stroke-width: 6; }
.mini-gauge-arc { fill: none; stroke: var(--blurple); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .5s var(--ease); }
.mini-gauge-label { font-size: 12px; color: var(--text-muted); line-height: 1.15; }
.mini-gauge-value { font-family: var(--font-display); font-weight: 800; color: var(--dark); font-size: 22px; letter-spacing: -0.02em; }

/* ---------------------------------------------------------------- */
/* VIEWS - overgang met opwaartse, licht schuine beweging           */
/* ---------------------------------------------------------------- */
.view { display: none; min-height: calc(100vh - 68px); }
.view.active { display: block; animation: viewIn .5s var(--ease); }
#view-start.active { display: grid; min-height: 100vh; }
@keyframes viewIn {
  from { opacity: 0; transform: translateY(18px) skewY(1.2deg); }
  to { opacity: 1; transform: none; }
}

.wrap { max-width: 1280px; margin: 0 auto; padding: 48px 40px 80px; }
.wrap-narrow { max-width: 760px; }
.page-head { margin-bottom: 32px; }
.page-head h2 { margin: 0 0 14px; }
.page-sub { color: var(--text-soft); font-size: 18px; line-height: 1.3; margin: 0; max-width: 680px; }

/* ---------------------------------------------------------------- */
/* START                                                            */
/* ---------------------------------------------------------------- */
#view-start { grid-template-columns: 1.05fr 1fr; background: var(--white); }
.start-left {
  display: flex; flex-direction: column; justify-content: center;
  padding: 56px clamp(24px, 6vw, 96px); position: relative;
}
.start-logo { height: 76px; align-self: flex-start; margin-bottom: 64px; }
.start-title { margin: 0 0 24px; }
.start-sub { color: var(--text-soft); margin: 0 0 40px; max-width: 540px; }

.field-label { display: block; font-size: 14px; font-weight: 700; color: var(--dark); margin-bottom: 10px; }
.input {
  width: 100%; padding: 13px 18px; border-radius: 999px;
  border: 1.5px solid var(--line-strong); background: var(--white);
  font-size: 16px; font-family: var(--font-body); color: var(--dark);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.input::placeholder { color: var(--text-muted); }
.input:focus { outline: none; border-color: var(--blurple); box-shadow: 0 0 0 4px var(--lavender); }
.start-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: stretch; max-width: 580px; }
#clientInput { flex: 1 1 260px; min-width: 220px; width: auto; }
.start-meta { margin: 18px 0 0; font-size: 14px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
.start-meta .material-symbols-outlined { font-size: 20px; }

.resume-card {
  display: flex; align-items: center; gap: 14px; margin-top: 28px; max-width: 580px;
  padding: 14px 14px 14px 18px; border-radius: var(--r-md); background: var(--lavender);
}
.resume-card > .material-symbols-outlined { color: var(--blurple); font-size: 26px; }
.resume-text { flex: 1; font-size: 15px; color: var(--dark); line-height: 1.3; }
.resume-text strong { font-weight: 700; }
.resume-text small { display: block; color: var(--text-soft); font-size: 13px; margin-top: 2px; }

/* Expressive look: Blurple vlak, Dark Blue typografie, rechte hoeken tot de rand */
.start-right {
  position: relative; overflow: hidden; background: var(--blurple);
  display: flex; align-items: center; justify-content: center;
  padding: 64px clamp(24px, 5vw, 80px);
}
.journey { position: relative; z-index: 1; width: 100%; max-width: 480px; }
.journey-title { color: var(--dark); margin: 0 0 28px; }
.journey-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.journey-step {
  display: grid; grid-template-columns: 56px 1fr; gap: 18px; align-items: center;
  background: var(--white); border-radius: var(--r-md); padding: 16px 20px;
  box-shadow: 0 14px 34px rgba(1, 1, 73, 0.18);
  opacity: 0; transform: translateY(18px) skewY(1.5deg); animation: stepIn .6s var(--ease) forwards;
}
.journey-step:nth-child(1) { animation-delay: .10s; }
.journey-step:nth-child(2) { animation-delay: .18s; }
.journey-step:nth-child(3) { animation-delay: .26s; }
.journey-step:nth-child(4) { animation-delay: .34s; }
@keyframes stepIn { to { opacity: 1; transform: none; } }
.journey-num { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: .95; letter-spacing: -0.02em; color: var(--blurple); }
.journey-step-title { display: block; font-weight: 700; color: var(--dark); font-size: 17px; margin-bottom: 4px; }
.journey-step-desc { display: block; font-size: 14px; color: var(--text-soft); line-height: 1.3; }

/* ---------------------------------------------------------------- */
/* SCAN                                                             */
/* ---------------------------------------------------------------- */
.scan-layout { display: grid; grid-template-columns: 300px 1fr; gap: 40px; align-items: start; }
.scan-layout > * { min-width: 0; }

.theme-nav {
  position: sticky; top: 92px;
  background: var(--white); border-radius: var(--r-lg);
  padding: 16px; box-shadow: var(--shadow-sm);
  max-height: calc(100vh - 116px); overflow: auto;
}
.theme-nav-head { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 8px 12px; }
.theme-nav-title { font-weight: 700; font-size: 15px; }
.theme-nav-total { font-size: 12px; color: var(--text-muted); }
.theme-nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.theme-link {
  width: 100%; display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center;
  text-align: left; padding: 8px; border-radius: var(--r-sm); border: none; background: transparent;
  font-size: 14px; color: var(--text-soft); transition: background .12s ease;
}
.theme-link:hover { background: var(--lavender-50); }
.theme-link-nr { font-family: var(--font-display); font-weight: 800; font-size: 14px; color: var(--line-strong); text-align: center; }
.theme-link-name { line-height: 1.25; }
.theme-link-count {
  min-width: 24px; height: 22px; padding: 0 7px; border-radius: 999px;
  font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; color: transparent;
}
.theme-link.has-flags .theme-link-count { background: var(--blurple); color: var(--dark); }
.theme-link.visited .theme-link-nr { color: var(--blurple); }
.theme-link.active { background: var(--lavender); color: var(--dark); font-weight: 700; }
.theme-link.active .theme-link-nr { color: var(--dark); }

.scan-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
.scan-progress { height: 4px; border-radius: 999px; background: var(--lavender); overflow: hidden; margin: 0 0 24px; }
.scan-progress-fill { display: block; height: 100%; width: 0; background: var(--blurple); border-radius: 999px; transition: width .45s var(--ease); }

.pain-counter {
  display: inline-flex; align-items: center; gap: 12px;
  background: var(--white); border-radius: 999px; padding: 6px 18px 6px 6px; box-shadow: var(--shadow-sm);
  font-size: 14px; color: var(--text-soft);
}
.pain-counter-num {
  min-width: 40px; height: 40px; padding: 0 8px; border-radius: 999px; background: var(--blurple); color: var(--dark);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em;
}

.scan-hint {
  display: flex; gap: 10px; align-items: flex-start;
  font-size: 15px; color: var(--dark); background: var(--lavender);
  border-radius: var(--r-md); padding: 14px 16px; margin: 0 0 20px; line-height: 1.3;
}
.scan-hint .material-symbols-outlined { color: var(--blurple); font-size: 22px; }

.scan-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
.scan-row {
  display: grid; grid-template-columns: 32px 1fr; gap: 18px; align-items: start; text-align: left;
  background: var(--white); border: 1.5px solid transparent; border-radius: var(--r-md);
  padding: 20px 22px; box-shadow: var(--shadow-sm);
  transition: border-color .15s ease, background .15s ease, transform .2s var(--ease);
}
.scan-row:hover { border-color: var(--line-strong); transform: translateY(-2px); }
.scan-row.pop { transform: translateY(-4px); }
.scan-check {
  width: 32px; height: 32px; border-radius: 999px; margin-top: -2px;
  border: 1.5px solid var(--line-strong); background: var(--white);
  display: flex; align-items: center; justify-content: center; color: transparent;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.scan-check .material-symbols-outlined { font-size: 20px; font-variation-settings: 'FILL' 0, 'wght' 600, 'GRAD' 0, 'opsz' 20; }
.scan-row.flagged { background: var(--lavender); border-color: var(--blurple); }
.scan-row.flagged .scan-check { background: var(--blurple); border-color: var(--blurple); color: var(--dark); }
.scan-text { display: flex; flex-direction: column; gap: 6px; }
.scan-titel { font-weight: 700; font-size: 17px; line-height: 1.1; }
.scan-stelling { font-size: 15px; color: var(--text-soft); line-height: 1.3; }
.scan-flag-label {
  display: none; align-self: flex-start; margin-top: 4px;
  font-size: 12px; font-weight: 600; color: var(--dark); background: var(--white);
  padding: 2px 10px; border-radius: 999px;
}
.scan-row.flagged .scan-flag-label { display: inline-block; }

.nav-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.kbd-hint { font-size: 13px; color: var(--text-muted); }
kbd {
  font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--text-soft);
  border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; background: var(--white);
}

/* ---------------------------------------------------------------- */
/* PRIORITEER                                                       */
/* ---------------------------------------------------------------- */
.prio-layout { display: grid; grid-template-columns: 1fr; gap: 28px; }
.matrix-outer { position: relative; padding: 6px 6px 40px 50px; }
.matrix {
  position: relative; width: 100%; aspect-ratio: 16 / 10; min-height: 380px;
  background: var(--white); border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
  transition: box-shadow .15s ease;
}
.matrix.matrix-hover { box-shadow: 0 0 0 4px var(--blurple), var(--shadow-sm); }
.matrix-quadrant { position: absolute; width: 50%; height: 50%; display: flex; padding: 18px; pointer-events: none; }
.q-head { display: flex; flex-direction: column; gap: 3px; }
.q-title { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; line-height: .95; }
.q-sub { font-size: 12px; }
.q-quickwin   { top: 0; left: 0; background: var(--lavender); color: var(--dark); border-top-left-radius: var(--r-lg); }
.q-project    { top: 0; right: 0; background: var(--lavender-50); color: var(--midnight); border-top-right-radius: var(--r-lg); justify-content: flex-end; text-align: right; }
.q-nice       { bottom: 0; left: 0; background: var(--offwhite); color: var(--text-soft); border-bottom-left-radius: var(--r-lg); align-items: flex-end; }
.q-reconsider { bottom: 0; right: 0; background: #FAF8F4; color: var(--text-muted); border-bottom-right-radius: var(--r-lg); align-items: flex-end; justify-content: flex-end; text-align: right; }
.q-quickwin .q-title { color: var(--blurple-dark); }
.q-badge { display: inline-flex; align-self: flex-start; margin-top: 6px; font-size: 12px; font-weight: 600; background: var(--coral); color: var(--dark); padding: 2px 10px; border-radius: 999px; }

.matrix-divider-v, .matrix-divider-h { position: absolute; background: var(--white); }
.matrix-divider-v { left: calc(50% - 2px); top: 0; bottom: 0; width: 4px; }
.matrix-divider-h { top: calc(50% - 2px); left: 0; right: 0; height: 4px; }
.axis-x-title, .axis-y-title { position: absolute; font-size: 13px; font-weight: 600; color: var(--text-soft); white-space: nowrap; }
.axis-x-title { left: 50%; bottom: -32px; transform: translateX(-50%); }
.axis-y-title { left: -26px; top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }

.prio-card {
  background: var(--white); border: 1.5px solid var(--line); border-radius: var(--r-sm);
  padding: 10px 12px; cursor: grab; touch-action: none; user-select: none;
  box-shadow: var(--shadow-sm); transition: border-color .15s ease, transform .2s var(--ease);
}
.prio-card:hover { border-color: var(--blurple); }
.prio-card-theme { display: block; font-size: 12px; color: var(--text-muted); }
.prio-card-title { display: block; font-weight: 700; font-size: 14px; margin-top: 2px; line-height: 1.15; }
.prio-card.placed {
  position: absolute; transform: translate(-50%, -50%); z-index: 5;
  width: 144px; padding: 6px 10px 6px 8px; border-radius: 999px; border-width: 1.5px;
  display: flex; align-items: center; gap: 6px;
}
.prio-card.placed::before { content: ""; flex: none; width: 10px; height: 10px; border-radius: 999px; background: var(--line-strong); }
.prio-card.placed .prio-card-theme { display: none; }
.prio-card.placed .prio-card-title { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0; min-width: 0; }
.prio-card.placed.in-quickwin { border-color: var(--blurple); }
.prio-card.placed.in-quickwin::before { background: var(--blurple); }
.prio-card.placed.in-project { border-color: var(--midnight); }
.prio-card.placed.in-project::before { background: var(--midnight); }
.prio-card.placed.in-nice::before { background: var(--blurple-300); }
.prio-card.placed.in-reconsider::before { background: var(--text-muted); }
.prio-card.dragging-source { opacity: .3; }
.prio-card-ghost { position: fixed; z-index: 999; pointer-events: none; opacity: .97; transform: rotate(-3deg); box-shadow: var(--shadow-md); border-color: var(--blurple); }

.tray-title { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 16px; margin: 0 0 12px; }
.tray-count { font-family: var(--font-display); font-weight: 800; font-size: 18px; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 999px; background: var(--lavender); display: inline-flex; align-items: center; justify-content: center; }
.tray {
  display: flex; gap: 10px; flex-wrap: wrap; min-height: 72px;
  background: var(--white); border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg); padding: 14px;
}
.tray-done { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; text-align: center; font-weight: 600; font-size: 15px; padding: 22px 8px; }
.tray-done .material-symbols-outlined { font-size: 36px; color: var(--blurple); }
.story-empty, #priorityEmptyMsg { color: var(--text-muted); font-size: 15px; margin: 0; }
.prio-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 28px; flex-wrap: wrap; gap: 12px; }
#priorityRemaining { font-size: 15px; color: var(--text-soft); }
.pulse-cta { animation: pulseCta 1.6s ease-in-out infinite; }
@keyframes pulseCta { 0%, 100% { box-shadow: 0 0 0 0 rgba(254, 110, 99, 0); } 50% { box-shadow: 0 0 0 8px rgba(254, 110, 99, .25); } }

/* ---------------------------------------------------------------- */
/* BUSINESS CASE                                                    */
/* ---------------------------------------------------------------- */
.card { background: var(--white); border-radius: var(--r-lg); padding: 32px; box-shadow: var(--shadow-sm); }
.biz-field { margin-bottom: 28px; }
.biz-field label { display: block; font-weight: 700; font-size: 18px; line-height: 1.2; margin-bottom: 14px; }
.biz-input-row { display: flex; align-items: center; gap: 12px; }
.biz-input-row .input { width: 140px; font-size: 20px; font-weight: 700; text-align: center; }
.biz-unit { font-size: 15px; color: var(--text-soft); }
.biz-unit-prefix { font-family: var(--font-display); font-weight: 800; font-size: 24px; }

.biz-result {
  position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 8px;
  background: var(--midnight); color: var(--white); border-radius: var(--r-md); padding: 28px; margin-top: 8px;
}
.biz-result .nshape { width: 72px; height: 72px; right: 28px; top: 28px; }
.biz-result .nshape path { fill: var(--blurple); }
.hl-label { display: inline-flex; align-self: flex-start; font-size: 12px; font-weight: 600; background: var(--coral); color: var(--dark); padding: 3px 10px; border-radius: 999px; position: relative; }
.biz-result-value { position: relative; font-family: var(--font-display); font-weight: 800; font-size: clamp(56px, 8vw, 96px); line-height: .95; letter-spacing: -0.02em; color: var(--white); margin-top: 6px; }
.biz-result-sub { position: relative; font-size: 16px; color: var(--lavender); }
.biz-result-sub strong { color: var(--white); }
.biz-note { font-size: 14px; color: var(--text-muted); margin: 18px 0 0; line-height: 1.3; }

/* ---------------------------------------------------------------- */
/* GROEIVERHAAL (high brand volume)                                 */
/* ---------------------------------------------------------------- */
.story-hero {
  position: relative; overflow: hidden;
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 44px;
  background: var(--blurple); color: var(--dark);
  border-radius: var(--r-lg); padding: 48px; margin-bottom: 24px;
}
.story-hero .nshape path { fill: var(--midnight); }
.story-hero .ns-1 { width: 132px; height: 132px; right: 44px; top: 40px; }
.story-hero .ns-2 { width: 56px; height: 56px; right: 196px; bottom: 40px; }
.story-hero .ns-2 path { fill: var(--lavender); }
.hero-gauge { position: relative; width: 190px; height: 190px; flex: none; z-index: 1; }
.hero-gauge svg { width: 190px; height: 190px; transform: rotate(-90deg); }
.hero-gauge-bg { fill: none; stroke: rgba(255, 255, 255, 0.35); stroke-width: 12; }
.hero-gauge-arc { fill: none; stroke: var(--dark); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1.3s var(--ease); }
.hero-gauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.hero-gauge-value { font-family: var(--font-display); font-weight: 800; font-size: 76px; line-height: .95; letter-spacing: -0.02em; color: var(--dark); }
.hero-gauge-suffix { font-size: 13px; color: var(--dark); margin-top: 4px; }
.story-hero-text { position: relative; z-index: 1; max-width: 720px; padding-right: 120px; }
.story-hero-text .eyebrow { color: var(--dark); }
.story-hero-title { margin: 0 0 18px; color: var(--dark); }
#storyNarrative { font-size: 18px; line-height: 1.3; color: var(--dark); margin: 0; }

.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.kpi { background: var(--white); border-radius: var(--r-lg); padding: 22px 22px 20px; box-shadow: var(--shadow-sm); }
.kpi-value { display: block; font-family: var(--font-display); font-weight: 800; font-size: clamp(48px, 5vw, 76px); line-height: .95; letter-spacing: -0.02em; }
.kpi-label { display: block; font-size: 14px; color: var(--text-soft); margin-top: 8px; line-height: 1.2; }
.kpi-accent .kpi-value { color: var(--blurple); }

.section { margin-bottom: 40px; }
.section-head { margin-bottom: 18px; }
.section-head h3 { margin: 0 0 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.section-sub { font-size: 15px; color: var(--text-soft); margin: 0; }
.tag { font-family: var(--font-body); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; letter-spacing: 0; }
.tag-quickwin { background: var(--blurple); color: var(--dark); }
.tag-project { background: var(--midnight); color: var(--white); }
.panel { background: var(--white); border-radius: var(--r-lg); padding: 28px; box-shadow: var(--shadow-sm); }

.bizcase {
  position: relative; overflow: hidden;
  background: var(--midnight); color: var(--white); border-radius: var(--r-lg); padding: 36px 40px; margin-bottom: 40px;
}
.bizcase .nshape { width: 84px; height: 84px; right: 36px; top: 36px; }
.bizcase .nshape path { fill: var(--blurple); }
.bizcase-inner { position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 40px; flex-wrap: wrap; }
.bizcase-main, .bizcase-wait { display: flex; flex-direction: column; gap: 8px; }
.bizcase-main { flex: 1 1 320px; }
.bizcase-wait { flex: 0 1 260px; padding-right: 110px; }
.bizcase-value { font-family: var(--font-display); font-weight: 800; font-size: clamp(56px, 7vw, 96px); line-height: .95; letter-spacing: -0.02em; color: var(--white); }
.bizcase-wait-value { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 4vw, 60px); line-height: .95; letter-spacing: -0.02em; color: var(--white); }
.bizcase-sub { font-size: 14px; color: var(--lavender); line-height: 1.3; }
.bizcase-label-plain { font-size: 12px; font-weight: 600; color: var(--lavender); }

.roadmap-track { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.roadmap-phase { background: var(--white); border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow-sm); }
.roadmap-phase-top { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 18px; }
.roadmap-phase-nr { font-family: var(--font-display); font-weight: 800; font-size: 60px; line-height: .8; letter-spacing: -0.02em; }
.roadmap-phase-quickwin .roadmap-phase-nr { color: var(--blurple); }
.roadmap-phase-project .roadmap-phase-nr { color: var(--midnight); }
.roadmap-phase-nice .roadmap-phase-nr { color: var(--blurple-300); }
.roadmap-phase-title { display: block; font-weight: 700; font-size: 17px; line-height: 1.1; }
.roadmap-phase-when { display: block; font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.roadmap-phase-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.roadmap-phase-list li { font-size: 14px; color: var(--text-soft); padding-left: 22px; position: relative; line-height: 1.3; }
.roadmap-phase-list li::before { content: "\2192"; position: absolute; left: 0; top: 0; color: var(--blurple); font-weight: 700; }
.roadmap-phase-empty { font-size: 14px; color: var(--text-muted); font-style: italic; margin: 0; }

.functie-grid { display: flex; flex-wrap: wrap; gap: 10px; }
.functie-chip { display: inline-flex; align-items: center; gap: 10px; background: var(--lavender); border-radius: 999px; padding: 6px 6px 6px 16px; }
.functie-chip.top { background: var(--blurple); }
.functie-naam { font-weight: 600; font-size: 14px; color: var(--dark); }
.functie-count { font-size: 12px; font-weight: 600; color: var(--white); background: var(--midnight); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }

.story-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 28px; align-items: start; }
.story-card { background: var(--white); border-radius: var(--r-lg); padding: 22px 24px; margin-bottom: 14px; box-shadow: var(--shadow-sm); border-top: 4px solid var(--line); }
.story-card-quickwin { border-top-color: var(--blurple); }
.story-card-project { border-top-color: var(--midnight); }
.story-card-theme { display: block; font-size: 12px; color: var(--text-muted); }
.story-card-title { display: block; font-weight: 700; font-size: 19px; line-height: 1.1; margin: 4px 0 14px; }
.story-card-row { display: grid; grid-template-columns: 24px 1fr; gap: 10px; margin: 8px 0; font-size: 15px; line-height: 1.3; color: var(--text-soft); }
.story-card-row .material-symbols-outlined { font-size: 20px; color: var(--blurple); }
.story-card-row strong { color: var(--dark); font-weight: 600; }
.story-card-functies { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.mini-chip { font-size: 12px; font-weight: 600; color: var(--dark); background: var(--lavender); padding: 3px 10px; border-radius: 999px; }

.qbar-row { display: grid; grid-template-columns: 120px 1fr 32px; align-items: center; gap: 12px; margin-bottom: 14px; }
.qbar-label { font-size: 14px; color: var(--text-soft); }
.qbar-track { background: var(--lavender-50); border-radius: 999px; height: 14px; overflow: hidden; }
.qbar-fill { display: block; height: 100%; border-radius: 999px; transition: width .8s var(--ease); }
.qbar-quickwin { background: var(--blurple); }
.qbar-project { background: var(--midnight); }
.qbar-nice { background: var(--blurple-300); }
.qbar-reconsider { background: var(--text-muted); }
.qbar-count { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; text-align: right; }

.heatmap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.heat-tile { border-radius: var(--r-sm); padding: 12px 8px; text-align: center; border: 1px solid var(--line); }
.heat-count { display: block; font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: .95; letter-spacing: -0.02em; color: var(--dark); }
.heat-name { display: block; font-size: 11px; color: var(--text-soft); margin-top: 4px; line-height: 1.2; }
.heat-tile-dark { border-color: transparent; }
.heat-tile-dark .heat-count { color: var(--white); }
.heat-tile-dark .heat-name { color: var(--lavender); }

/* Beslismoment */
.decision-section {
  position: relative; overflow: hidden;
  background: var(--lavender); border-radius: var(--r-lg); padding: 40px; margin: 8px 0 12px;
}
.decision-section .nshape { width: 64px; height: 64px; right: 36px; top: 36px; }
.decision-section .nshape path { fill: var(--blurple); }
.decision-title { position: relative; margin: 0 0 10px; }
.decision-sub { position: relative; font-size: 16px; color: var(--text-soft); margin: 0 0 24px; }
.decision-cards { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.decision-card {
  text-align: left; background: var(--white); border: 2px solid transparent; border-radius: var(--r-md);
  padding: 20px; display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-sm);
  transition: border-color .15s ease, transform .2s var(--ease);
}
.decision-card:hover { transform: translateY(-3px); border-color: var(--line-strong); }
.decision-card.selected { border-color: var(--blurple); }
.decision-card-icon { width: 44px; height: 44px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 6px; background: var(--lavender); color: var(--dark); }
.decision-card.selected .decision-card-icon { background: var(--blurple); }
.decision-card-title { font-weight: 700; font-size: 17px; line-height: 1.15; }
.decision-card-desc { font-size: 14px; color: var(--text-soft); line-height: 1.3; }
.decision-followup { position: relative; margin-top: 16px; background: var(--white); border-radius: var(--r-md); padding: 18px 20px; font-size: 16px; line-height: 1.3; }
.decision-followup p { margin: 0; }
.decision-date-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.decision-date-row label { font-size: 14px; font-weight: 700; }
.decision-date-row .input { width: auto; padding: 8px 16px; font-size: 15px; }

.story-footer { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 20px; flex-wrap: wrap; }

/* Status centrale opslag (alleen zichtbaar in de Apps Script-webapp) */
.cloud-status { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
.cloud-status .material-symbols-outlined { font-size: 19px; }
.cloud-status.is-saved .material-symbols-outlined { color: var(--blurple); }
.cloud-status.is-error { color: var(--dark); }
.cloud-status.is-error .material-symbols-outlined { color: var(--coral-dark); }
@media (max-width: 1100px) { .cloud-status span:last-child { display: none; } }

/* PDF maken: overlay met voortgang */
.pdf-overlay { position: fixed; inset: 0; z-index: 900; background: rgba(0, 0, 29, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.pdf-overlay-box { background: var(--white); border-radius: var(--r-lg); padding: 28px 32px; min-width: 280px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; box-shadow: var(--shadow-md); }
.pdf-overlay-box b { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
#pdfProgress { font-size: 14px; color: var(--text-soft); }
.pdf-ready { display: flex; flex-direction: column; align-items: stretch; gap: 10px; margin-top: 14px; width: 100%; }
.pdf-ready .btn { justify-content: center; }
.pdf-ready .btn-tertiary { align-self: center; }
.pdf-spinner { width: 40px; height: 40px; border-radius: 999px; border: 4px solid var(--lavender); border-top-color: var(--blurple); animation: spin 0.9s linear infinite; margin-bottom: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
#report.capturing { left: 0; z-index: 800; visibility: visible; }

/* Toasts + confetti */
#toastContainer { position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; width: max-content; max-width: calc(100vw - 32px); }
.toast {
  background: var(--dark); color: var(--white); padding: 12px 22px; border-radius: 999px;
  font-size: 15px; font-weight: 600; opacity: 0; transform: translateY(12px);
  transition: opacity .25s ease, transform .3s var(--ease); box-shadow: var(--shadow-md); text-align: center;
}
.toast.toast-long { border-radius: var(--r-md); font-weight: 400; }
.toast-in { opacity: 1; transform: translateY(0); }
.confetti-piece { position: fixed; width: 12px; height: 12px; pointer-events: none; z-index: 300; animation: confettiFly .8s ease-out forwards; }
.confetti-piece svg { width: 100%; height: 100%; display: block; }
@keyframes confettiFly { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .journey-step { opacity: 1; transform: none; }
}

/* ---------------------------------------------------------------- */
/* LITE / CAMPAGNE                                                  */
/* ---------------------------------------------------------------- */
.journey-campaign { color: var(--dark); margin: 0 0 22px; font-size: clamp(36px, 3.8vw, 56px); }
.journey-title.sub-l { margin: 0 0 16px; }
.journey-signoff { margin: 22px 0 0; font-weight: 700; font-size: 17px; color: var(--dark); }
.prio-hint { margin-top: 18px; max-width: 680px; }
.biz-result-hours:empty { display: none; }
.heatmap { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }

/* Kwadrantkiezer (tikken in plaats van slepen) */
.q-picker {
  position: fixed; z-index: 950; width: 280px; max-width: calc(100vw - 32px);
  background: var(--white); border-radius: var(--r-md); box-shadow: var(--shadow-md);
  padding: 14px; border: 1.5px solid var(--line);
}
.q-picker-title { display: block; font-weight: 700; font-size: 14px; line-height: 1.2; margin: 2px 4px 10px; }
.q-picker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.q-picker-btn {
  text-align: left; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--white);
  padding: 9px 10px; font-size: 13px; line-height: 1.2; display: flex; flex-direction: column; gap: 2px;
  transition: border-color .15s ease, background .15s ease;
}
.q-picker-btn b { font-size: 14px; }
.q-picker-btn small { color: var(--text-muted); font-size: 11.5px; }
.q-picker-btn:hover, .q-picker-btn:focus-visible { border-color: var(--blurple); background: var(--lavender-50); }
.q-picker-btn.qp-quickwin { background: var(--lavender); border-color: var(--lavender); }
.q-picker-btn.qp-quickwin:hover { border-color: var(--blurple); }

/* Gegevens achterlaten voor de PDF */
.lead-overlay { position: fixed; inset: 0; z-index: 920; background: rgba(0, 0, 29, 0.55); display: flex; align-items: flex-start; justify-content: center; padding: 32px 16px; overflow-y: auto; }
.lead-box { position: relative; width: 100%; max-width: 620px; background: var(--white); border-radius: var(--r-lg); box-shadow: var(--shadow-md); padding: 36px 36px 28px; overflow: hidden; }
.lead-close { position: absolute; top: 14px; right: 14px; z-index: 2; width: 40px; height: 40px; border-radius: 999px; border: none; background: var(--lavender-50); display: flex; align-items: center; justify-content: center; }
.lead-close:hover { background: var(--lavender); }
.lead-title { margin: 0 0 12px; padding-right: 40px; }
.lead-intro { color: var(--text-soft); font-size: 16px; line-height: 1.35; margin: 0 0 22px; padding-right: 40px; }
.lead-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 14px; }
.lead-grid .full { grid-column: 1 / -1; }
.lead-field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.lead-field .input { padding: 10px 16px; font-size: 15px; }
.lead-field .input[aria-invalid="true"] { border-color: var(--coral-dark); box-shadow: 0 0 0 3px rgba(254, 110, 99, .18); }
.lead-row-pc { display: grid; grid-template-columns: 140px 1fr; gap: 14px; }
.lead-consent { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; margin: 18px 0 0; font-size: 14px; line-height: 1.35; color: var(--text-soft); }
.lead-consent input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--blurple); }
.lead-consent.invalid { color: var(--coral-dark); }
.lead-consent a { color: var(--dark); }
.lead-hp { position: absolute !important; left: -9999px !important; width: 1px; height: 1px; overflow: hidden; }
.lead-error { margin: 16px 0 0; padding: 10px 14px; border-radius: var(--r-sm); background: #FFECEA; color: var(--dark); font-size: 14px; line-height: 1.35; }
.lead-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 22px; }
.lead-fine { font-size: 13px; color: var(--text-muted); margin: 0; flex: 1 1 200px; line-height: 1.35; }
@media (max-width: 560px) {
  .lead-box { padding: 28px 20px 22px; }
  .lead-grid, .lead-row-pc { grid-template-columns: 1fr; }
  .lead-title, .lead-intro { padding-right: 0; }
  .lead-actions .btn { width: 100%; }
}

/* ---------------------------------------------------------------- */
/* RESPONSIVE                                                       */
/* ---------------------------------------------------------------- */
@media (min-width: 900px) {
  .prio-layout { grid-template-columns: 2.3fr 1fr; }
  .tray { flex-direction: column; align-items: stretch; min-height: 440px; align-content: flex-start; }
}
@media (max-width: 1100px) {
  .steps .step-label { display: none; }
  .step { padding: 6px; }
  #topbar { padding: 12px 24px; }
}
@media (max-width: 960px) {
  #view-start { grid-template-columns: 1fr; }
  .start-right { padding: 48px 24px 64px; }
  .start-logo { margin-bottom: 40px; height: 64px; }
  .scan-layout { grid-template-columns: 1fr; gap: 18px; }
  .theme-nav { position: static; max-height: none; padding: 10px; overflow: visible; }
  .theme-nav-list { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; scrollbar-width: thin; }
  .theme-link-name { white-space: nowrap; }
  .theme-link { width: auto; white-space: nowrap; grid-template-columns: auto auto auto; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .story-grid { grid-template-columns: 1fr; }
  .roadmap-track, .decision-cards { grid-template-columns: 1fr; }
