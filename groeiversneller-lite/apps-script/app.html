  function logoSvg(kind) {
    const l = LOGOS[kind];
    return '<svg viewBox="0 0 ' + l.w + ' ' + l.h + '" aria-hidden="true" focusable="false">' +
      '<path class="sym" d="' + l.sym + '"/><path class="word" d="' + l.word + '"/></svg>';
  }
  // N-vorm uit het visual system: ronde hoeken linksboven/rechtsonder,
  // scherpe punten rechtsboven/linksonder.
  const NSHAPE_PATH = "M100 0 C93 2 90 8 90 18 L90 72 C90 88 81 100 64 100 L0 100 C7 98 10 92 10 82 L10 28 C10 12 19 0 36 0 Z";
  function nshapeSvg() {
    return '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false"><path d="' + NSHAPE_PATH + '"/></svg>';
  }

  // ---------------------------------------------------------------
  // STATE
  // ---------------------------------------------------------------
  const state = {
    client: "",
    themeIndex: 0,
    visited: new Set(),           // thema-indexen die al bekeken zijn
    flagged: new Set(),           // keys "themeId:nr"
    placements: {},               // key -> { xPct, yPct, quadrant }
    view: "start",
    bizHours: null,
    bizRate: 45,
    decision: null,               // "quickwin" | "kennismaken" | "wachten" | null
    decisionDate: "",
    sessionId: "",                // vaste ID per sessie (voor centrale opslag)
    startedAt: "",
    lead: null,                   // NAWET-gegevens, pas gevuld na het formulier voor de PDF
    bron: {},                     // campagnebron uit de URL (utm_source, utm_campaign, ...)
  };

  const QUADRANTS = {
    quickwin:   { label: "Quick win",     weight: 10 },
    project:    { label: "Groot project", weight: 6  },
    nice:       { label: "Nice to have",  weight: 2  },
    reconsider: { label: "Heroverwegen",  weight: 1  },
  };

  const STEP_ORDER = ["scan", "priority", "businesscase", "story"];

  function keyOf(themeId, nr) { return themeId + ":" + nr; }

  function joinWithEn(arr) {
    if (arr.length === 0) return "";
    if (arr.length === 1) return arr[0];
    return arr.slice(0, -1).join(", ") + " en " + arr[arr.length - 1];
  }

  function findItem(key) {
    const [themeId, nr] = key.split(":").map(Number);
    const theme = THEMES.find(t => t.id === themeId);
    if (!theme) return null;
    const item = theme.items.find(i => i.nr === nr);
    if (!item) return null;
    return { theme, item };
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }

  // ---------------------------------------------------------------
  // OPSLAG: sessie overleeft een per ongeluk ververste pagina.
  // Alleen lokaal in deze browser; er gaat niets naar een server.
  // ---------------------------------------------------------------
  const SESSION_KEY = "groeiversneller_sessie_v1";

  function sessionSnapshot() {
    return {
      sessionId: state.sessionId,
      startedAt: state.startedAt,
      client: state.client,
        themeIndex: state.themeIndex,
        visited: Array.from(state.visited),
        flagged: Array.from(state.flagged),
        placements: state.placements,
        bizHours: state.bizHours,
        bizRate: state.bizRate,
        decision: state.decision,
        decisionDate: state.decisionDate,
        lead: state.lead,
        bron: state.bron,
      view: state.view,
      savedAt: Date.now(),
    };
  }

  function saveSession() {
    if (!state.client) return;
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify(sessionSnapshot()));
    } catch (e) { /* opslag niet beschikbaar: app werkt gewoon door */ }
    scheduleCloudSave();
  }

  function newSessionId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "s-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  // ---------------------------------------------------------------
  // CENTRALE OPSLAG (alleen als de app als Google Apps Script-webapp draait):
  // na elke wijziging wordt de sessie bewaard in de Google Sheet via
  // bewaarSessie() in Code.gs. Lokaal geopend werkt de app zoals altijd.
  // ---------------------------------------------------------------
  // Webadres van de Apps Script-webapp (eindigt op /exec). Alleen nodig als deze pagina
  // BUITEN Apps Script draait, bijvoorbeeld op groeiversneller.nmbrs.com; de pagina stuurt
  // de gegevens dan naar dit adres. Leeg = lokaal testen, er wordt niets opgeslagen.
  // bouw_apps_script.py vult dit automatisch in voor de versie in de map web/.
  const OPSLAG_URL = "";

  // Eén manier om de server aan te roepen, in Apps Script (google.script.run) en daarbuiten (fetch).
  function hasServer() { return isAppsScript() || !!OPSLAG_URL; }
  function serverCall(actie, payload, onOk, onFail) {
    if (isAppsScript()) {
      google.script.run.withSuccessHandler(onOk).withFailureHandler(onFail)[actie](payload);
      return;
    }
    // text/plain houdt het een "eenvoudig" verzoek: geen CORS-voorcontrole, die Apps Script niet ondersteunt.
    fetch(OPSLAG_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ actie, data: payload }),
    })
      .then(r => r.json())
      .then(res => { if (res && res.ok) onOk(res); else onFail(new Error((res && res.fout) || "Onbekende fout")); })
      .catch(onFail);
  }

  const CLOUD_DELAY_MS = 1500;
  let cloudTimer = null;
  let cloudBusy = false;
  let cloudAgain = false;
  let cloudPending = false;

  function setCloudStatus(kind, detail) {
    const el = $("#cloudStatus");
    if (!el) return;
    const map = {
      pending: ["cloud_upload", "Opslaan\u2026"],
      saved: ["cloud_done", "Bewaard"],
      error: ["cloud_off", "Niet bewaard"],
    };
    const m = map[kind];
    el.classList.remove("hidden", "is-pending", "is-saved", "is-error");
    el.classList.add("is-" + kind);
    el.innerHTML = '<span class="material-symbols-outlined" aria-hidden="true">' + m[0] + '</span><span>' + m[1] + '</span>';
    el.title = kind === "error"
      ? "De sessie kon niet centraal worden bewaard" + (detail ? ": " + detail : "") + ". We proberen het bij de volgende wijziging opnieuw; lokaal is alles wel bewaard."
      : kind === "saved" ? "Deze sessie is bewaard in de centrale Google Sheet." : "Bezig met bewaren\u2026";
  }

  function scheduleCloudSave() {
    if (!hasServer() || !state.client || !state.sessionId) return;
    cloudPending = true;
    setCloudStatus("pending");
    clearTimeout(cloudTimer);
    cloudTimer = setTimeout(cloudSave, CLOUD_DELAY_MS);
  }

  function cloudSave() {
    if (cloudBusy) { cloudAgain = true; return; }
    let payload;
    try { payload = cloudPayload(); } catch (e) { setCloudStatus("error", e.message); return; }
    cloudBusy = true;
    const done = () => {
      cloudBusy = false;
      if (cloudAgain) { cloudAgain = false; cloudSave(); }
    };
    serverCall("bewaarSessie", payload,
      () => { cloudPending = cloudAgain; if (!cloudAgain) setCloudStatus("saved"); done(); },
      err => { setCloudStatus("error", err && err.message ? err.message : String(err)); done(); });
  }

  function cloudPayload() {
    const d = computeStoryData();
    const g = d.groups;
    const STEP_LABELS = { scan: "Scan", priority: "Prioriteer", businesscase: "Business case", story: "Groeiverhaal" };
    const items = Array.from(state.flagged).map(k => {
      const f = findItem(k);
      if (!f) return null;
      const p = state.placements[k];
      return { thema: f.theme.naam, titel: f.item.titel, kwadrant: p ? QUADRANTS[p.quadrant].label : "Nog niet geprioriteerd", functies: f.item.functies || [] };
    }).filter(Boolean);
    return {
      sessieId: state.sessionId,
      gestart: state.startedAt,
      klant: state.client,
      stap: STEP_LABELS[state.view] || state.view,
      score: d.score,
      pijnpunten: d.totalFlagged,
      geprioriteerd: d.totalPlaced,
      quickWins: g.quickwin.length,
      groteProjecten: g.project.length,
      niceToHave: g.nice.length,
      heroverwegen: g.reconsider.length,
      businessCase: state.bizHours == null ? {} : {
        urenPerWeek: state.bizHours, uurtarief: state.bizRate,
        perJaar: Math.round(d.bizAnnual), perMaand: Math.round(d.bizMonthly),
      },
      eersteStap: state.decision ? DECISION_LABELS[state.decision] : "",
      startdatum: state.decisionDate || "",
      topThema: d.topTheme ? d.topTheme.naam : "",
      quickWinTitels: g.quickwin.map(x => x.item.titel),
      projectTitels: g.project.map(x => x.item.titel),
      functionaliteiten: d.sortedFuncties.map(([naam, n]) => naam + " (" + n + ")"),
      items,
      gegevensAchtergelaten: !!state.lead,
      bron: bronLabel(),
      // Back-up zonder contactgegevens: die staan apart in het tabblad Leads.
      backup: Object.assign(sessionSnapshot(), { lead: null }),
    };
  }

  function bronLabel() {
    return Object.entries(state.bron || {}).map(([k, v]) => k + "=" + v).join("; ");
  }

  // Waarschuwen als iemand de pagina sluit terwijl er nog iets bewaard moet worden.
  window.addEventListener("beforeunload", (e) => {
    if (hasServer() && (cloudPending || cloudBusy)) { e.preventDefault(); e.returnValue = ""; }
  });

  function loadSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return s && s.client ? s : null;
    } catch (e) { return null; }
  }

  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* negeren */ }
  }

  // ---------------------------------------------------------------
  // DOM
  // ---------------------------------------------------------------
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const views = {
    start: $("#view-start"),
    scan: $("#view-scan"),
    priority: $("#view-priority"),
    businesscase: $("#view-businesscase"),
    story: $("#view-story"),
  };
  const topbar = $("#topbar");
  const miniGaugeValue = $("#miniGaugeValue");
  const miniGaugeArc = $("#miniGaugeArc");
  const clientLabel = $("#clientLabel");

  function showView(name) {
    Object.entries(views).forEach(([k, el]) => el.classList.toggle("active", k === name));
    state.view = name;
    topbar.classList.toggle("hidden", name === "start");
    const activeIdx = STEP_ORDER.indexOf(name);
    $$(".step").forEach(s => {
      const idx = STEP_ORDER.indexOf(s.dataset.step);
      s.classList.toggle("step-active", idx === activeIdx);
      s.classList.toggle("step-done", activeIdx > -1 && idx < activeIdx);
      if (idx === activeIdx) s.setAttribute("aria-current", "step"); else s.removeAttribute("aria-current");
    });
    window.scrollTo({ top: 0, behavior: "auto" });
    saveSession();
  }

  // Stappen in de topbar zijn altijd aanklikbaar: vrij heen en terug navigeren,
  // zodat een sales rep nooit vastloopt in een voorwaartse flow.
  $$(".step").forEach(stepEl => {
    stepEl.addEventListener("click", () => goTo(stepEl.dataset.step));
  });

  function goTo(target) {
    if (target === "scan") buildScanTheme(state.themeIndex);
    if (target === "priority") renderPriority();
    if (target === "businesscase") updateBizPreview();
    if (target === "story") buildStory();
    showView(target);
  }

  // ---------------------------------------------------------------
  // GAUGE
  // ---------------------------------------------------------------
  function setGaugeArc(circleEl, pct) {
    const r = circleEl.r.baseVal.value;
    const c = 2 * Math.PI * r;
    circleEl.style.strokeDasharray = c.toFixed(2);
    circleEl.style.strokeDashoffset = (c * (1 - pct / 100)).toFixed(2);
  }

  function computeScore() {
    const flaggedCount = state.flagged.size;
    if (flaggedCount === 0) return 0;
    let earned = 0;
    Object.values(state.placements).forEach(p => { earned += QUADRANTS[p.quadrant].weight; });
    // Onbeplaatste pijnpunten tellen nog niet mee -> motiveert om te prioriteren.
    const maxPossible = flaggedCount * QUADRANTS.quickwin.weight;
    return Math.round((earned / maxPossible) * 100);
  }

  function updateMiniGauge(animate) {
    const score = computeScore();
    if (animate) animateNumber(miniGaugeValue, parseInt(miniGaugeValue.textContent || "0", 10), score, 500);
    else miniGaugeValue.textContent = score;
    setGaugeArc(miniGaugeArc, score);
  }

  function animateNumber(el, from, to, duration, format) {
    const fmt = format || (v => String(v));
    const start = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      el.textContent = fmt(Math.round(from + (to - from) * eased));
      if (t < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------
  // START
  // ---------------------------------------------------------------
  const clientInput = $("#clientInput");
  const startBtn = $("#startBtn");
  const resumeCard = $("#resumeCard");

  function initStart() {
    const totalItems = THEMES.reduce((a, t) => a + t.items.length, 0);
    $("#totalItemsCount").textContent = totalItems;
    $("#totalThemesCount").textContent = THEMES.length;
    $("#themeNavTotal").textContent = totalItems + " stellingen";
    $("#startMetaItems").textContent = totalItems;
    $("#startMetaThemes").textContent = THEMES.length;

    startBtn.addEventListener("click", () => {
      resetState();
      state.client = (clientInput.value || "").trim().slice(0, 120) || "jouw organisatie";
      state.sessionId = newSessionId();
      state.startedAt = new Date().toISOString();
      clientLabel.textContent = state.client;
      buildScanTheme(0);
      showView("scan");
    });
    clientInput.addEventListener("keydown", (e) => { if (e.key === "Enter") startBtn.click(); });

    const saved = loadSession();
    if (saved) {
      resumeCard.classList.remove("hidden");
      $("#resumeClient").textContent = "Verder met de scan voor " + saved.client + "?";
      const when = new Date(saved.savedAt || Date.now()).toLocaleString("nl-NL", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
      $("#resumeMeta").textContent = plural((saved.flagged || []).length, "pijnpunt", "pijnpunten") + " · laatst bewaard " + when;
      $("#resumeBtn").addEventListener("click", () => restoreSession(saved));
    }
  }

  function restoreSession(s) {
    resetState();
    state.client = s.client;
    state.sessionId = s.sessionId || newSessionId();
    state.startedAt = s.startedAt || new Date(s.savedAt || Date.now()).toISOString();
    state.themeIndex = Math.min(Math.max(0, s.themeIndex || 0), THEMES.length - 1);
    (s.visited || []).forEach(i => state.visited.add(i));
    // Alleen keys die nog in de data bestaan (data kan tussentijds wijzigen).
    (s.flagged || []).forEach(k => { if (findItem(k)) state.flagged.add(k); });
    Object.entries(s.placements || {}).forEach(([k, p]) => {
      if (state.flagged.has(k) && p && QUADRANTS[p.quadrant]) state.placements[k] = p;
    });
    state.bizHours = s.bizHours == null ? null : s.bizHours;
    state.bizRate = s.bizRate == null ? 45 : s.bizRate;
    state.decision = s.decision === "voorstel" ? "kennismaken" : (DECISION_LABELS[s.decision] ? s.decision : null);
    state.decisionDate = s.decisionDate || "";
    state.lead = s.lead && s.lead.email ? s.lead : null;
    // Een nieuwe campagnelink wint van de bron uit de bewaarde sessie.
    if (!Object.keys(state.bron).length && s.bron) state.bron = s.bron;

    clientLabel.textContent = state.client;
    bizHoursInput.value = state.bizHours == null ? "" : state.bizHours;
    bizRateInput.value = state.bizRate;
    flaggedCountEl.textContent = state.flagged.size;
    updateMiniGauge(false);
    goTo(STEP_ORDER.includes(s.view) ? s.view : "scan");
    showToast("Welkom terug! Je kunt verder waar je gebleven was.");
  }

  function resetState() {
    state.sessionId = "";
    state.startedAt = "";
    clearTimeout(cloudTimer);
    cloudPending = false;
    const cs = $("#cloudStatus"); if (cs) cs.classList.add("hidden");
    state.flagged.clear();
    state.visited.clear();
    state.placements = {};
    state.themeIndex = 0;
    state.bizHours = null;
    state.bizRate = 45;
    state.decision = null;
    state.decisionDate = "";
    state.lead = null;
    bizHoursInput.value = "";
    bizRateInput.value = "45";
    flaggedCountEl.textContent = "0";
    miniGaugeValue.textContent = "0";
    setGaugeArc(miniGaugeArc, 0);
  }

  // ---------------------------------------------------------------
  // SCAN
  // ---------------------------------------------------------------
  const scanThemeTitle = $("#scanThemeTitle");
  const scanThemeCounter = $("#scanThemeCounter");
  const scanItemList = $("#scanItemList");
  const scanPrevBtn = $("#scanPrevBtn");
  const scanNextBtn = $("#scanNextBtn");
  const themeNavList = $("#themeNavList");
  const flaggedCountEl = $("#flaggedCount");
  const scanProgressFill = $("#scanProgressFill");

  function buildThemeNav() {
    themeNavList.innerHTML = "";
    THEMES.forEach((t, i) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.className = "theme-link";
      b.innerHTML =
        '<span class="theme-link-nr">' + (i + 1) + '</span>' +
        '<span class="theme-link-name">' + escapeHtml(t.naam) + '</span>' +
        '<span class="theme-link-count"></span>';
      b.title = t.naam;
      b.addEventListener("click", () => buildScanTheme(i));
      li.appendChild(b);
      themeNavList.appendChild(li);
    });
  }

  function themeFlagCount(i) {
    const t = THEMES[i];
    return t.items.filter(it => state.flagged.has(keyOf(t.id, it.nr))).length;
  }

  function updateThemeNav() {
    $$(".theme-link", themeNavList).forEach((b, i) => {
      const n = themeFlagCount(i);
      b.classList.toggle("active", i === state.themeIndex);
      b.classList.toggle("visited", state.visited.has(i));
      b.classList.toggle("has-flags", n > 0);
      $(".theme-link-count", b).textContent = n > 0 ? n : "";
      if (i === state.themeIndex) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    });
    const active = $$(".theme-link", themeNavList)[state.themeIndex];
    if (active && window.matchMedia("(max-width: 960px)").matches) {
      active.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
    }
  }

  function buildScanTheme(index) {
    state.themeIndex = index;
    state.visited.add(index);
    const theme = THEMES[index];
    scanThemeTitle.textContent = theme.naam;
    scanThemeCounter.textContent = "Stap 1 · Thema " + (index + 1) + " van " + THEMES.length + " · Wat is nog niet goed ingeregeld?";
    scanProgressFill.style.width = ((index + 1) / THEMES.length * 100) + "%";
    scanItemList.innerHTML = "";

    theme.items.forEach(item => {
      const key = keyOf(theme.id, item.nr);
      const isFlagged = state.flagged.has(key);
      const row = document.createElement("button");
      row.type = "button";
      row.className = "scan-row" + (isFlagged ? " flagged" : "");
      row.dataset.key = key;
      row.setAttribute("aria-pressed", isFlagged ? "true" : "false");
      row.innerHTML =
        '<span class="scan-check" aria-hidden="true"><span class="material-symbols-outlined">check</span></span>' +
        '<span class="scan-text">' +
          '<span class="scan-titel">' + escapeHtml(item.titel) + '</span>' +
          '<span class="scan-stelling">“' + escapeHtml(item.stelling) + '”</span>' +
          '<span class="scan-flag-label">Pijnpunt</span>' +
        '</span>';
      row.addEventListener("click", () => toggleFlag(key, row));
      scanItemList.appendChild(row);
    });

    updateThemeNav();
    scanPrevBtn.disabled = index === 0;
    const last = index === THEMES.length - 1;
    scanNextBtn.innerHTML = (last ? "Naar prioriteren" : "Volgend thema") + ' <span class="arrow" aria-hidden="true">&rarr;</span>';
    saveSession();
  }

  function toggleFlag(key, rowEl) {
    if (state.flagged.has(key)) {
      state.flagged.delete(key);
      delete state.placements[key];
      rowEl.classList.remove("flagged");
      rowEl.setAttribute("aria-pressed", "false");
    } else {
      state.flagged.add(key);
      rowEl.classList.add("flagged", "pop");
      rowEl.setAttribute("aria-pressed", "true");
      setTimeout(() => rowEl.classList.remove("pop"), 260);
    }
    animateNumber(flaggedCountEl, parseInt(flaggedCountEl.textContent || "0", 10), state.flagged.size, 350);
    updateMiniGauge(false);
    updateThemeNav();
    saveSession();
  }

  scanPrevBtn.addEventListener("click", () => {
    if (state.themeIndex > 0) buildScanTheme(state.themeIndex - 1);
  });
  scanNextBtn.addEventListener("click", () => {
    if (state.themeIndex < THEMES.length - 1) {
      buildScanTheme(state.themeIndex + 1);
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else {
      goTo("priority");
    }
  });

  document.addEventListener("keydown", (e) => {
    if (state.view !== "scan") return;
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === "ArrowRight" && state.themeIndex < THEMES.length - 1) { e.preventDefault(); buildScanTheme(state.themeIndex + 1); }
    if (e.key === "ArrowLeft" && state.themeIndex > 0) { e.preventDefault(); buildScanTheme(state.themeIndex - 1); }
  });

  // ---------------------------------------------------------------
  // PRIORITEER
  // ---------------------------------------------------------------
  const priorityTray = $("#priorityTray");
  const priorityMatrix = $("#priorityMatrix");
  const priorityRemaining = $("#priorityRemaining");
  const priorityToBizCaseBtn = $("#priorityToBizCaseBtn");
  const priorityEmptyMsg = $("#priorityEmptyMsg");
  const trayCount = $("#trayCount");

  function renderPriority() {
    priorityTray.innerHTML = "";
    $$(".prio-card.placed", priorityMatrix).forEach(el => el.remove());

    const keys = Array.from(state.flagged);
    priorityEmptyMsg.classList.toggle("hidden", keys.length > 0);

    keys.forEach(key => {
      const found = findItem(key);
      if (!found) return;
      const card = buildPrioCard(key, found.item, found.theme);
      const placement = state.placements[key];
      if (placement) placeCardEl(card, placement);
      else priorityTray.appendChild(card);
    });

    updateRemainingLabel();
    updateMiniGauge(false);
  }

  function placeCardEl(card, p) {
    card.classList.add("placed");
    card.classList.remove("in-quickwin", "in-project", "in-nice", "in-reconsider");
    card.classList.add("in-" + p.quadrant);
    card.style.left = p.xPct + "%";
    card.style.top = p.yPct + "%";
    priorityMatrix.appendChild(card);
  }

  function updateRemainingLabel() {
    const total = state.flagged.size;
    const placed = Object.keys(state.placements).length;
    const remaining = total - placed;
    trayCount.textContent = remaining;
    const doneMsg = $(".tray-done", priorityTray);
    if (doneMsg) doneMsg.remove();
    if (total === 0) {
      priorityRemaining.textContent = "Nog geen pijnpunten aangetikt in de scan.";
      priorityToBizCaseBtn.classList.remove("pulse-cta");
    } else if (remaining === 0) {
      priorityRemaining.textContent = "Alle " + total + " kaartjes zijn geplaatst.";
      priorityToBizCaseBtn.classList.add("pulse-cta");
      const done = document.createElement("div");
      done.className = "tray-done";
      done.innerHTML = '<span class="material-symbols-outlined" aria-hidden="true">task_alt</span>Alles geplaatst. Mooi werk!';
      priorityTray.appendChild(done);
    } else {
      priorityRemaining.textContent = remaining + " van de " + total + " kaartjes nog te plaatsen.";
      priorityToBizCaseBtn.classList.remove("pulse-cta");
    }
  }

  function buildPrioCard(key, item, theme) {
    const card = document.createElement("div");
    card.className = "prio-card";
    card.dataset.key = key;
    card.title = theme.naam + " — " + item.titel;
    card.innerHTML =
      '<span class="prio-card-theme">' + escapeHtml(theme.naam) + '</span>' +
      '<span class="prio-card-title">' + escapeHtml(item.titel) + '</span>';
    attachDrag(card);
    return card;
  }

  function placeAt(key, card, rawX, rawY, clientX, clientY) {
    const quadrant = quadrantFromPct(rawX, rawY);
    const free = findFreeSpot(rawX, rawY, key);
    const wasQuickWin = state.placements[key] && state.placements[key].quadrant === "quickwin";
    state.placements[key] = { xPct: free.xPct, yPct: free.yPct, quadrant };
    placeCardEl(card, state.placements[key]);
    if (quadrant === "quickwin" && !wasQuickWin) {
      burstConfetti(clientX, clientY);
      showToast("Quick win! ⚡");
    }
    updateRemainingLabel();
    updateMiniGauge(true);
    saveSession();
  }

  function attachDrag(card) {
    card.addEventListener("pointerdown", (downEvt) => {
      if (downEvt.button !== undefined && downEvt.button !== 0) return;
      downEvt.preventDefault();
      const key = card.dataset.key;
      const startedInMatrix = card.parentElement === priorityMatrix;

      const ghost = card.cloneNode(true);
      ghost.classList.remove("placed", "in-quickwin", "in-project", "in-nice", "in-reconsider");
      ghost.classList.add("prio-card-ghost");
      ghost.style.width = Math.max(card.offsetWidth, 160) + "px";
      ghost.style.left = ghost.style.top = "";
      document.body.appendChild(ghost);
      card.classList.add("dragging-source");

      function moveGhost(x, y) {
        ghost.style.left = (x - ghost.offsetWidth / 2) + "px";
        ghost.style.top = (y - ghost.offsetHeight / 2) + "px";
      }
      moveGhost(downEvt.clientX, downEvt.clientY);

      function onMove(moveEvt) {
        moveGhost(moveEvt.clientX, moveEvt.clientY);
        // Rect elke keer opnieuw: de pagina kan tijdens het slepen scrollen.
        const inside = isInsideRect(moveEvt.clientX, moveEvt.clientY, priorityMatrix.getBoundingClientRect());
        priorityMatrix.classList.toggle("matrix-hover", inside);
      }

      function onUp(upEvt) {
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        window.removeEventListener("pointercancel", onUp);
        ghost.remove();
        card.classList.remove("dragging-source");
        priorityMatrix.classList.remove("matrix-hover");

        // Tikken zonder te slepen: kies het vak uit een lijstje (fijner op telefoon).
        const isTap = upEvt.type !== "pointercancel" &&
          Math.hypot(upEvt.clientX - downEvt.clientX, upEvt.clientY - downEvt.clientY) < 8;
        if (isTap) {
          if (!startedInMatrix && card.parentElement !== priorityTray) priorityTray.insertBefore(card, priorityTray.firstChild);
          openQuadrantPicker(card, false);
          return;
        }

        const rect = priorityMatrix.getBoundingClientRect();
        if (upEvt.type !== "pointercancel" && isInsideRect(upEvt.clientX, upEvt.clientY, rect)) {
          const rawX = clamp(((upEvt.clientX - rect.left) / rect.width) * 100, 2, 98);
          const rawY = clamp(((upEvt.clientY - rect.top) / rect.height) * 100, 2, 98);
          placeAt(key, card, rawX, rawY, upEvt.clientX, upEvt.clientY);
        } else if (!startedInMatrix) {
          priorityTray.insertBefore(card, priorityTray.firstChild);
        }
      }

      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
    });

    // Toetsenbord: focus een kaartje en kies een kwadrant met 1-4.
    card.tabIndex = 0;
    card.setAttribute("role", "button");
    card.setAttribute("aria-label", card.title + ". Druk Enter om een vak te kiezen, of 1 quick win, 2 groot project, 3 nice to have, 4 heroverwegen.");
    card.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openQuadrantPicker(card, true); return; }
      const q = { "1": "quickwin", "2": "project", "3": "nice", "4": "reconsider" }[e.key];
      if (!q) return;
      e.preventDefault();
      placeInQuadrant(card, q);
      card.focus();
    });
  }

  // Na het plaatsen van een kaartje blijft het scherm waar het was (sommige telefoons springen anders terug naar boven).
  function houdScrollpositie(y) {
    const herstel = () => { if (Math.abs(window.scrollY - y) > 2) window.scrollTo(0, y); };
    herstel();
    requestAnimationFrame(herstel);
    setTimeout(herstel, 120);
    setTimeout(herstel, 400);
  }

  const QUADRANT_CENTER = { quickwin: [25, 25], project: [75, 25], nice: [25, 75], reconsider: [75, 75] };
  function placeInQuadrant(card, q) {
    const rect = priorityMatrix.getBoundingClientRect();
    const jitterX = (Math.random() - 0.5) * 20, jitterY = (Math.random() - 0.5) * 20;
    const x = QUADRANT_CENTER[q][0] + jitterX, y = QUADRANT_CENTER[q][1] + jitterY;
    placeAt(card.dataset.key, card, x, y, rect.left + rect.width * x / 100, rect.top + rect.height * y / 100);
  }

  // Kwadrantkiezer: verschijnt bij het aangetikte kaartje.
  let quadrantPicker = null;
  let pickerScrollY = 0;
  function closeQuadrantPicker() {
    if (quadrantPicker) { quadrantPicker.remove(); quadrantPicker = null; }
  }
  function openQuadrantPicker(card, viaToetsenbord) {
    closeQuadrantPicker();
    const found = findItem(card.dataset.key);
    const opts = [
      ["quickwin", "Quick win", "Veel impact, weinig moeite"],
      ["project", "Groot project", "Veel impact, veel moeite"],
      ["nice", "Nice to have", "Weinig impact, weinig moeite"],
      ["reconsider", "Heroverwegen", "Weinig impact, veel moeite"],
    ];
    const el = document.createElement("div");
    el.className = "q-picker";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-label", "Kies een vak");
    el.innerHTML = '<span class="q-picker-title">' + escapeHtml(found ? found.item.titel : "") + '</span><div class="q-picker-grid">' +
      opts.map(([q, t, d]) => '<button type="button" class="q-picker-btn qp-' + q + '" data-q="' + q + '"><b>' + t + '</b><small>' + d + '</small></button>').join("") +
      '</div>';
    document.body.appendChild(el);
    quadrantPicker = el;
    pickerScrollY = window.scrollY;
    const r = card.getBoundingClientRect();
    const w = el.offsetWidth, h = el.offsetHeight;
    let left = Math.min(Math.max(16, r.left + r.width / 2 - w / 2), window.innerWidth - w - 16);
    let top = r.bottom + 8;
    if (top + h > window.innerHeight - 16) top = Math.max(16, r.top - h - 8);
    el.style.left = left + "px";
    el.style.top = top + "px";
    $$(".q-picker-btn", el).forEach(b => b.addEventListener("click", () => {
      const y = window.scrollY;
      closeQuadrantPicker();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      placeInQuadrant(card, b.dataset.q);
      houdScrollpositie(y);
    }));
    // Alleen bij toetsenbordgebruik de focus verplaatsen: op een telefoon kan focus het scherm laten verspringen.
    if (viaToetsenbord) $(".q-picker-btn", el).focus({ preventScroll: true });
  }
  document.addEventListener("pointerdown", (e) => {
    if (quadrantPicker && !quadrantPicker.contains(e.target)) closeQuadrantPicker();
  }, true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeQuadrantPicker(); });
  // Alleen sluiten bij echt scrollen; een kleine verschuiving (bijv. naschok op een telefoon) niet.
  window.addEventListener("scroll", () => {
    if (quadrantPicker && Math.abs(window.scrollY - pickerScrollY) > 60) closeQuadrantPicker();
  }, { passive: true });
  window.addEventListener("resize", closeQuadrantPicker);

  function isInsideRect(x, y, rect) {
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  }
  function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

  // Voorkomt dat kaartjes exact op elkaar landen: schuift een nieuwe plek
  // in een kleine spiraal op totdat er geen andere kaart te dichtbij is.
  // Blijft binnen hetzelfde kwadrant, zodat de betekenis niet verandert.
  function findFreeSpot(xPct, yPct, ignoreKey) {
    const minDist = 13;
    const others = Object.entries(state.placements).filter(([k]) => k !== ignoreKey).map(([, p]) => p);
    const tooClose = (x, y) => others.some(p => Math.hypot(p.xPct - x, p.yPct - y) < minDist);

    const xMin = xPct < 50 ? 8 : 58, xMax = xPct < 50 ? 42 : 92;
    const yMin = yPct < 50 ? 5 : 55, yMax = yPct < 50 ? 45 : 95;

    if (!tooClose(xPct, yPct)) return { xPct, yPct };
    for (let ring = 1; ring <= 6; ring++) {
      const steps = ring * 8;
      for (let s = 0; s < steps; s++) {
        const angle = (s / steps) * Math.PI * 2;
        const r = ring * (minDist * 0.55);
        const nx = clamp(xPct + Math.cos(angle) * r, xMin, xMax);
        const ny = clamp(yPct + Math.sin(angle) * r, yMin, yMax);
        if (!tooClose(nx, ny)) return { xPct: nx, yPct: ny };
      }
    }
    return { xPct, yPct };
  }

  function quadrantFromPct(xPct, yPct) {
    // x: inspanning (laag -> hoog), y: impact (DOM y=0 is boven = hoge impact)
    const highImpact = yPct < 50;
    const lowEffort = xPct < 50;
    if (highImpact && lowEffort) return "quickwin";
    if (highImpact) return "project";
    if (lowEffort) return "nice";
    return "reconsider";
  }

  priorityToBizCaseBtn.addEventListener("click", () => {
    if (state.flagged.size > 0 && Object.keys(state.placements).length === 0) {
      showToast("Zet minstens 1 kaartje op de matrix: sleep het, of tik het aan en kies een vak.");
      return;
    }
    goTo("businesscase");
  });

  // ---------------------------------------------------------------
  // BUSINESS CASE: eigen inschatting van de klant, geen benchmark.
  // ---------------------------------------------------------------
  const bizHoursInput = $("#bizHours");
  const bizRateInput = $("#bizRate");
  const bizAnnualValueEl = $("#bizAnnualValue");
  const bizMonthlyValueEl = $("#bizMonthlyValue");

  function formatEuro(n) {
    return Math.round(n).toLocaleString("nl-NL", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  }

  function formatHours(n) {
    return Math.round(n).toLocaleString("nl-NL") + " uur";
  }

  function computeBizCase() {
    const hours = Math.max(0, parseFloat(bizHoursInput.value) || 0);
    const rate = Math.max(0, parseFloat(bizRateInput.value) || 0);
    state.bizHours = bizHoursInput.value === "" ? null : hours;
    state.bizRate = rate;
    const annual = hours * 52 * rate;
    return { hours, rate, annual, monthly: annual / 12 };
  }

  function updateBizPreview() {
    const c = computeBizCase();
    bizAnnualValueEl.textContent = formatEuro(c.annual);
    bizMonthlyValueEl.textContent = formatEuro(c.monthly);
    $("#bizHoursYear").textContent = c.hours > 0
      ? "Dat is zo'n " + formatHours(c.hours * 52) + " per jaar. Meer tijd? Die zit hier."
      : "";
  }
  bizHoursInput.addEventListener("input", () => { updateBizPreview(); saveSession(); });
  bizRateInput.addEventListener("input", () => { updateBizPreview(); saveSession(); });

  $("#bizBackBtn").addEventListener("click", () => goTo("priority"));
  $("#bizToStoryBtn").addEventListener("click", () => goTo("story"));

  // ---------------------------------------------------------------
  // TOAST + CONFETTI
  // ---------------------------------------------------------------
  const toastContainer = $("#toastContainer");
  function showToast(text, ms) {
    const t = document.createElement("div");
    t.className = "toast" + (text.length > 70 ? " toast-long" : "");
    t.textContent = text;
    toastContainer.appendChild(t);
    requestAnimationFrame(() => t.classList.add("toast-in"));
    setTimeout(() => {
      t.classList.remove("toast-in");
      setTimeout(() => t.remove(), 300);
    }, ms || (text.length > 70 ? 5000 : 1800));
  }

  const confettiColors = ["#6B5DFF", "#6B5DFF", "#E7E5FF", "#010149", "#FE6E63"];
  function burstConfetti(x, y) {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < 22; i++) {
      const p = document.createElement("span");

  function groupByQuadrant() {
    const groups = { quickwin: [], project: [], nice: [], reconsider: [] };
    Object.entries(state.placements).forEach(([key, p]) => {
      const found = findItem(key);
      if (found) groups[p.quadrant].push({ key, ...found });
    });
    return groups;
  }

  function todayLabel() {
    return new Date().toLocaleDateString("nl-NL", { day: "numeric", month: "long", year: "numeric" });
  }

  // Alle afgeleide Groeiverhaal-data op één plek, zodat scherm, PDF en
  // Google Doc gegarandeerd hetzelfde verhaal vertellen.
  function computeStoryData() {
    const score = computeScore();
    const groups = groupByQuadrant();
    const totalFlagged = state.flagged.size;
    const totalPlaced = Object.keys(state.placements).length;

    const themeCounts = {};
    state.flagged.forEach(key => {
      const [themeId] = key.split(":").map(Number);
      themeCounts[themeId] = (themeCounts[themeId] || 0) + 1;
    });
    // Alleen een thema bij naam noemen als het ALS ENIGE de meeste pijnpunten
    // heeft; bij een gelijke stand zou anders altijd het laagste id 'winnen'.
    const maxThemeFlagCount = totalFlagged === 0 ? 0 : Math.max(...Object.values(themeCounts));
    const topThemeIds = Object.keys(themeCounts).map(Number).filter(id => themeCounts[id] === maxThemeFlagCount);
    const topTheme = (maxThemeFlagCount > 0 && topThemeIds.length === 1) ? THEMES.find(t => t.id === topThemeIds[0]) : null;
    const multipleTopThemes = topThemeIds.length > 1;

    let narrative = "Je hebt voor " + state.client + " " + plural(totalFlagged, "pijnpunt", "pijnpunten") + " aangetikt: onderdelen van de medewerkersreis die nog niet goed zijn ingeregeld";
    if (topTheme) narrative += ", met de meeste aandacht voor het thema ‘" + topTheme.naam + "’";
    else if (multipleTopThemes) narrative += ", verspreid over meerdere thema's";
    narrative += ". ";

    if (totalPlaced > 0) {
      const parts = [];
      if (groups.quickwin.length) parts.push(plural(groups.quickwin.length, "quick win", "quick wins"));
      if (groups.project.length) parts.push(plural(groups.project.length, "groot project", "grote projecten"));
      if (groups.nice.length) parts.push(groups.nice.length + " bij nice to have");
      if (groups.reconsider.length) parts.push(groups.reconsider.length + " om te heroverwegen");
      narrative += "Op de matrix is de verdeling: " + joinWithEn(parts) + ". ";
      if (groups.quickwin.length) {
        narrative += (groups.quickwin.length === 1 ? "De quick win is" : "De quick wins zijn") + " meteen te verzilveren, zonder dat het een groot project wordt. ";
      }
      if (groups.project.length) {
        narrative += (groups.project.length === 1 ? "Het grote project verdient" : "De grote projecten verdienen") + " een plek op de roadmap, met blijvende impact op de langere termijn. ";
      }
    }
    if (totalPlaced < totalFlagged) {
      const remaining = totalFlagged - totalPlaced;
      narrative += "Er " + (remaining === 1 ? "staat nog 1 kaartje" : "staan nog " + remaining + " kaartjes") + " klaar om te prioriteren. ";
    }

    const functieCounts = {};
    state.flagged.forEach(key => {
      const found = findItem(key);
      if (!found) return;
      (found.item.functies || []).forEach(f => { functieCounts[f] = (functieCounts[f] || 0) + 1; });
    });
    const sortedFuncties = Object.entries(functieCounts).sort((a, b) => b[1] - a[1]);
    const maxThemeCount = Math.max(1, ...THEMES.map(t => themeCounts[t.id] || 0));

    const bizAnnual = (state.bizHours || 0) * 52 * (state.bizRate || 0);
    const bizMonthly = bizAnnual / 12;

    return { score, groups, totalFlagged, totalPlaced, narrative, themeCounts, topTheme, sortedFuncties, maxThemeCount, bizAnnual, bizMonthly };
  }

  function buildStory() {
    const data = computeStoryData();
    const groups = data.groups;
    $("#storyClientName").textContent = state.client;

    animateNumber(heroGaugeValue, 0, data.score, 1200);
    setGaugeArc(heroGaugeArc, 0);
    setTimeout(() => setGaugeArc(heroGaugeArc, data.score), 60);
    $("#storyNarrative").textContent = data.narrative;

    // KPI's
    animateNumber($("#kpiPain"), 0, data.totalFlagged, 800);
    animateNumber($("#kpiQuickwin"), 0, groups.quickwin.length, 800);
    animateNumber($("#kpiProject"), 0, groups.project.length, 800);
    animateNumber($("#kpiFuncties"), 0, data.sortedFuncties.length, 800);

    // Quick wins en grote projecten
    fillCardList(quickWinList, groups.quickwin, "quickwin", "Nog geen kaartjes in het quick win-kwadrant geplaatst.");
    fillCardList(projectList, groups.project, "project", "Geen kaartjes in dit kwadrant.");

    $("#niceReconsiderCount").textContent =
      groups.nice.length + " bij ‘nice to have’, " + groups.reconsider.length + " bij ‘heroverwegen’.";

    // Verdeling
    quadrantBars.innerHTML = "";
    const maxCount = Math.max(1, groups.quickwin.length, groups.project.length, groups.nice.length, groups.reconsider.length);
    Object.entries(QUADRANTS).forEach(([qKey, meta]) => {
      const count = groups[qKey].length;
      const bar = document.createElement("div");
      bar.className = "qbar-row";
      bar.innerHTML =
        '<span class="qbar-label">' + meta.label + '</span>' +
        '<span class="qbar-track"><span class="qbar-fill qbar-' + qKey + '" style="width:0"></span></span>' +
        '<span class="qbar-count">' + count + '</span>';
      quadrantBars.appendChild(bar);
      const fill = $(".qbar-fill", bar);
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = ((count / maxCount) * 100) + "%"; }));
    });

    // Functionaliteiten
    functieOverzicht.innerHTML = "";
    if (data.sortedFuncties.length === 0) {
      functieOverzicht.innerHTML = '<p class="story-empty">Nog geen pijnpunten gevonden om functionaliteiten aan te koppelen.</p>';
    } else {
      const topCount = data.sortedFuncties[0][1];
      data.sortedFuncties.forEach(([naam, count]) => {
        const chip = document.createElement("div");
        chip.className = "functie-chip" + (count === topCount && topCount > 1 ? " top" : "");
        chip.innerHTML =
          '<span class="functie-naam">' + escapeHtml(naam) + '</span>' +
          '<span class="functie-count">' + plural(count, "pijnpunt", "pijnpunten") + '</span>';
        functieOverzicht.appendChild(chip);
      });
    }

    // Heatmap per thema, in de merkblauwen (Agile -> People)
    themeHeatmap.innerHTML = "";
    // Lavender -> Blurple -> Midnight
    const STOPS = [[231, 229, 255], [107, 93, 255], [1, 1, 73]];
    const mix = (a, b, f) => a.map((v, i) => Math.round(v + (b[i] - v) * f));
    const heatColor = t => t <= 0.5 ? mix(STOPS[0], STOPS[1], t * 2) : mix(STOPS[1], STOPS[2], (t - 0.5) * 2);
    THEMES.forEach(t => {
      const c = data.themeCounts[t.id] || 0;
      const intensity = c === 0 ? 0 : (0.15 + 0.85 * (c / data.maxThemeCount));
      const tile = document.createElement("div");
      const rgb = c === 0 ? [255, 255, 255] : heatColor(intensity);
      // Kies de tekstkleur met het hoogste WCAG-contrast (wit of Dark Blue).
      const lin = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
      const L = 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2]);
      const useWhite = (1.05 / (L + 0.05)) > ((L + 0.05) / 0.0513);
      tile.className = "heat-tile" + (useWhite ? " heat-tile-dark" : "");
      tile.style.background = "rgb(" + rgb.join(",") + ")";
      tile.innerHTML = '<span class="heat-count">' + c + '</span><span class="heat-name">' + escapeHtml(t.naam) + '</span>';
      themeHeatmap.appendChild(tile);
    });

    // Business case, alleen als er echt iets is ingevuld
    if (data.bizAnnual > 0) {
      bizCaseSection.classList.remove("hidden");
      $("#bizCaseHours").textContent = " · zo'n " + formatHours(state.bizHours * 52) + " per jaar die je terug kunt winnen";
      animateNumber($("#bizCaseAnnual"), 0, Math.round(data.bizAnnual), 1100, formatEuro);
      $("#bizCaseMonthly").textContent = formatEuro(data.bizMonthly);
    } else {
      bizCaseSection.classList.add("hidden");
    }

    // Roadmap
    roadmapTrack.innerHTML = "";
    const phases = [
      { cls: "roadmap-phase-quickwin", nr: 1, title: "Quick wins", when: "Deze maand", items: groups.quickwin },
      { cls: "roadmap-phase-project", nr: 2, title: "Grote projecten", when: "Dit kwartaal", items: groups.project },
      { cls: "roadmap-phase-nice", nr: 3, title: "Nice to have", when: "Wanneer het past", items: groups.nice },
    ];
    phases.forEach(phase => {
      const card = document.createElement("div");
      card.className = "roadmap-phase " + phase.cls;
      const listHtml = phase.items.length === 0
        ? '<p class="roadmap-phase-empty">Nog niets hier geplaatst.</p>'
        : '<ul class="roadmap-phase-list">' + phase.items.map(({ item }) => "<li>" + escapeHtml(item.titel) + "</li>").join("") + "</ul>";
      card.innerHTML =
        '<div class="roadmap-phase-top">' +
          '<span class="roadmap-phase-nr">0' + phase.nr + '</span>' +
          '<span><span class="roadmap-phase-title">' + phase.title + '</span><span class="roadmap-phase-when">' + phase.when + '</span></span>' +
        '</div>' + listHtml;
      roadmapTrack.appendChild(card);
    });

    restoreDecisionUI();
  }

  function fillCardList(container, entries, kind, emptyText) {
    container.innerHTML = "";

      container.innerHTML = '<p class="story-empty">' + emptyText + '</p>';

  const PRIVACY_URL = "";
  const LEAD_KEY = "groeiversneller_lite_gegevens";   // vult het formulier vooraf bij een volgende keer
  const leadOverlay = $("#leadOverlay");
  const leadForm = $("#leadForm");
  const leadError = $("#leadError");
  const leadSubmitBtn = $("#leadSubmitBtn");
  const LEAD_FIELDS = {
    naam: "#leadNaam", bedrijf: "#leadBedrijf", adres: "#leadAdres", postcode: "#leadPostcode",
    plaats: "#leadPlaats", email: "#leadEmail", telefoon: "#leadTelefoon",
  };
  const LEAD_LABELS = {
    naam: "je naam", bedrijf: "je organisatie", adres: "je adres", postcode: "je postcode",
    plaats: "je plaats", email: "een geldig e-mailadres", telefoon: "een geldig telefoonnummer",

  function requestPdf() {
    if (!state.decision) { askForDecision(); return; }

  // Een eerste stap kiezen is verplicht voor de download.
  function askForDecision() {
    const sec = $("#decisionSection");
    sec.scrollIntoView({ behavior: "smooth", block: "center" });
    sec.classList.remove("needs-choice");
    void sec.offsetWidth; // animatie opnieuw starten
    sec.classList.add("needs-choice");
    showToast("Kies eerst je eerste stap, dan download je je groeiverhaal.");
  }

  function openLeadGate() {
    let remembered = {};
    try { remembered = JSON.parse(localStorage.getItem(LEAD_KEY) || "{}") || {}; } catch (e) { /* negeren */ }
    Object.entries(LEAD_FIELDS).forEach(([k, sel]) => {
      const el = $(sel);
      el.removeAttribute("aria-invalid");
      if (!el.value) el.value = remembered[k] || "";
    });
    const bedrijf = $("#leadBedrijf");
    if (state.client && state.client !== "jouw organisatie") bedrijf.value = state.client;
    $("#leadConsentRow").classList.remove("invalid");
    $("#leadKlantRow").classList.remove("invalid");
    if (!klantKeuze() && (remembered.nmbrsKlant === "ja" || remembered.nmbrsKlant === "nee")) {
      $('input[name="nmbrsKlant"][value="' + remembered.nmbrsKlant + '"]').checked = true;
    }
    leadError.classList.add("hidden");
    leadReturnFocus = document.activeElement;
    leadOverlay.classList.remove("hidden");
    document.body.style.overflow = "hidden";
    const firstEmpty = Object.values(LEAD_FIELDS).map(sel => $(sel)).find(el => !el.value.trim());
    (firstEmpty || $("#leadConsent")).focus();
  }

  function closeLeadGate() {
    leadOverlay.classList.add("hidden");
    document.body.style.overflow = "";
    if (leadReturnFocus && leadReturnFocus.focus) leadReturnFocus.focus();
  }

  function klantKeuze() {
    const r = $('input[name="nmbrsKlant"]:checked');
    return r ? r.value : "";
  }

  function readLeadForm() {
    const lead = {};
    Object.entries(LEAD_FIELDS).forEach(([k, sel]) => { lead[k] = $(sel).value.trim().replace(/\s+/g, " "); });
    lead.email = lead.email.toLowerCase();
    lead.postcode = lead.postcode.toUpperCase();
    lead.nmbrsKlant = klantKeuze();   // "ja" of "nee"
    return lead;
  }

  function validateLead(lead) {
    const bad = [];
    Object.keys(LEAD_FIELDS).forEach(k => { if (!lead[k]) bad.push(k); });
    if (lead.email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(lead.email)) bad.push("email");
    if (lead.telefoon && (lead.telefoon.replace(/\D/g, "").length < 9 || /[^\d\s+()\-.]/.test(lead.telefoon))) bad.push("telefoon");
    return Array.from(new Set(bad));
  }

  function showLeadError(msg) {
    leadError.textContent = msg;
    leadError.classList.remove("hidden");
  }

  leadForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const lead = readLeadForm();
    const bad = validateLead(lead);
    Object.entries(LEAD_FIELDS).forEach(([k, sel]) => {
      if (bad.includes(k)) $(sel).setAttribute("aria-invalid", "true"); else $(sel).removeAttribute("aria-invalid");
    });
    const consent = $("#leadConsent").checked;
    $("#leadConsentRow").classList.toggle("invalid", !consent);
    $("#leadKlantRow").classList.toggle("invalid", !lead.nmbrsKlant);
    if (bad.length || !consent || !lead.nmbrsKlant) {
      const parts = bad.map(k => LEAD_LABELS[k]);
      if (!consent) parts.push("je toestemming");
      const zinnen = [];
      if (parts.length) zinnen.push("Vul nog even " + joinWithEn(parts) + " in.");
      if (!lead.nmbrsKlant) zinnen.push("Geef " + (parts.length ? "ook " : "nog even ") + "aan of je organisatie al Nmbrs Payroll gebruikt.");
      showLeadError(zinnen.join(" "));
      if (bad.length) $(LEAD_FIELDS[bad[0]]).focus();
      return;
    }
    leadError.classList.add("hidden");
    // Honeypot: alleen bots vullen dit verborgen veld; dan stil afronden zonder opslaan.
    const isBot = !!$("#leadWebsite").value;
    lead.toestemming = true;
    lead.datum = new Date().toISOString();

    const unlock = () => {
      state.lead = lead;
      try { localStorage.setItem(LEAD_KEY, JSON.stringify(Object.assign({}, lead, { toestemming: undefined, datum: undefined }))); } catch (err) { /* negeren */ }
      saveSession();
      closeLeadGate();
      showToast("Dank je, " + lead.naam.split(" ")[0] + "! Je groeiverhaal wordt gemaakt.");
      downloadPdf();
    };

    if (!hasServer() || isBot) {
      // Lokaal geopend (testen): er is geen Sheet, de PDF komt direct vrij.
      if (!hasServer()) console.warn("Geen opslag ingesteld: gegevens niet naar de Sheet verstuurd.", lead);
      unlock();
      return;
    }
    leadSubmitBtn.disabled = true;
    const originalHtml = leadSubmitBtn.innerHTML;
    leadSubmitBtn.textContent = "Even geduld…";
    let payload;
    try { payload = Object.assign(cloudPayload(), { lead, backup: null, items: null }); }
    catch (err) { payload = { sessieId: state.sessionId, klant: state.client, lead }; }
    serverCall("bewaarLead", payload,
      () => { leadSubmitBtn.disabled = false; leadSubmitBtn.innerHTML = originalHtml; unlock(); },
      err => {
        leadSubmitBtn.disabled = false;
        leadSubmitBtn.innerHTML = originalHtml;
        console.error(err);
        showLeadError("Het versturen lukte niet. Controleer je internetverbinding en probeer het opnieuw.");
      });
  });

  function firstSentence(s) {

  function gaugeSvg(score) {
    const r = 40, c = 2 * Math.PI * r;
    return '<svg viewBox="0 0 100 100" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="9"/>' +
      '<circle cx="50" cy="50" r="' + r + '" fill="none" stroke="#00001D" stroke-width="9" stroke-linecap="round" transform="rotate(-90 50 50)" ' +
      'stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + (c * (1 - score / 100)).toFixed(2) + '"/></svg>';

  function buildReport() {
    const data = computeStoryData();
    const g = data.groups;
    const client = escapeHtml(state.client || "deze organisatie");
    const year = new Date().getFullYear();
    reportEl.innerHTML = "";

    // Vaste nummering van alle geplaatste pijnpunten, in volgorde van prioriteit.
    const ordered = [];
    ["quickwin", "project", "nice", "reconsider"].forEach(q => g[q].forEach(x => ordered.push(Object.assign({ q }, x))));
    const nr = {};
    ordered.forEach((x, i) => { nr[x.key] = i + 1; });
    const mark = (key, q) => '<span class="rp-mark rq-' + q + '">' + nr[key] + '</span>';

    const pages = [];
    let secCount = 0;

    function addGraphics(p) {
      $$("[data-logo]", p).forEach(el => { el.innerHTML = logoSvg(el.dataset.logo); });
      $$("[data-n]", p).forEach(el => { el.innerHTML = nshapeSvg(); });
    }
    function newPage(cls, label) {
      const p = document.createElement("section");
      p.className = "rp-page " + (cls || "");
      if (label !== undefined) {
        p.innerHTML =
          '<header class="rp-head"><span class="logo" data-logo="secondary"></span>' +
          '<span class="rp-head-meta"><b>' + label + '</b>Groeiverhaal &middot; ' + client + '</span></header>' +
          '<div class="rp-body"></div>' +
          '<footer class="rp-foot"><span>Vertrouwelijk &middot; &copy; ' + year + ' Nmbrs &middot; nmbrs.com</span><span class="rp-pnum"></span></footer>';
      }
      reportEl.appendChild(p);
      addGraphics(p);
      pages.push(p);
      return p;
    }
    const bodyOf = p => $(".rp-body", p);
    const overflows = p => { const b = bodyOf(p); return b.scrollHeight > b.clientHeight + 1; };
    function node(html) {
      const t = document.createElement("template");
      t.innerHTML = html.trim();
      return t.content.firstElementChild;
    }
    function secHead(title, lead) {
      secCount++;
      return '<div class="rp-sec"><span class="rp-sec-num">' + String(secCount).padStart(2, "0") + '</span>' +
        '<h2 class="rp-sec-title">' + title + '</h2>' + (lead ? '<p class="rp-sec-lead">' + lead + '</p>' : '') + '</div>';
    }
    // Sectie met doorloop: elk blok gaat naar de volgende pagina als het niet meer past.
    function section(label, title, lead, blocks) {
      let p = newPage("", label);
      bodyOf(p).appendChild(node(secHead(title, lead)));
      blocks.forEach(html => {
        const n = node(html);
        bodyOf(p).appendChild(n);
        if (overflows(p) && bodyOf(p).children.length > 1) {
          n.remove();
          p = newPage("", label);
          bodyOf(p).appendChild(node('<p class="rp-cont">' + title + ' &middot; vervolg</p>'));
          bodyOf(p).appendChild(n);
          addGraphics(n);
        } else {
          addGraphics(n);
        }
      });
      return p;
    }

    // 1. Cover -------------------------------------------------------
    const cover = newPage("rp-cover");
    cover.innerHTML =
      '<span class="nshape" data-n style="width:118mm;height:118mm;right:-34mm;top:44mm"></span>' +
      '<span class="nshape" data-n style="width:30mm;height:30mm;right:98mm;top:30mm;--c:var(--lavender)"></span>' +
      '<span class="nshape" data-n style="width:16mm;height:16mm;right:20mm;top:178mm"></span>' +
      '<span class="logo mono" data-logo="primary" role="img" aria-label="Nmbrs"></span>' +
      '<span class="rp-cover-class">Vertrouwelijk</span>' +
      '<div class="rp-cover-body">' +
        '<p class="rp-cover-eyebrow">De Groeiversneller &middot; Meer tijd. Minder zorgen.</p>' +
        '<h1 class="rp-cover-title rp-d">Groei&shy;verhaal</h1>' +
        '<p class="rp-cover-client">voor ' + client + '</p>' +
      '</div>' +
      '<div class="rp-cover-meta">' +
        '<div><span>Opgesteld op</span><strong>' + todayLabel() + '</strong></div>' +
        (state.lead ? '<div><span>Voor</span><strong>' + escapeHtml(state.lead.naam) + '</strong></div>' : '') +
        '<div><span>Groeipotentieel</span><strong>' + data.score + ' / 100</strong></div>' +
        '<div><span>Pijnpunten geprioriteerd</span><strong>' + data.totalPlaced + ' van ' + data.totalFlagged + '</strong></div>' +
      '</div>';
    addGraphics(cover);

    // 2. In één oogopslag --------------------------------------------
    const startWith = g.quickwin.concat(g.project).slice(0, 3);
    const p2 = newPage("", "Samenvatting");
    let html = secHead("In &eacute;&eacute;n oogopslag");
    html +=
      '<div class="rp-hero"><span class="nshape" data-n></span>' +
        '<div class="rp-gauge">' + gaugeSvg(data.score) + '<div class="rp-gauge-val"><span class="rp-d">' + data.score + '</span><span>van 100</span></div></div>' +
        '<div><span class="rp-label">Groeipotentieel</span><p>' + escapeHtml(data.narrative) + '</p></div>' +
      '</div>' +
      '<div class="rp-kpis">' +
        '<div class="rp-kpi"><span class="rp-d">' + data.totalFlagged + '</span><span>pijnpunten gevonden</span></div>' +
        '<div class="rp-kpi accent"><span class="rp-d">' + g.quickwin.length + '</span><span>quick wins</span></div>' +
        '<div class="rp-kpi"><span class="rp-d">' + g.project.length + '</span><span>grote projecten</span></div>' +
        '<div class="rp-kpi"><span class="rp-d">' + data.sortedFuncties.length + '</span><span>Nmbrs-functionaliteiten die helpen</span></div>' +
      '</div>';
    if (data.bizAnnual > 0) {
      html +=
        '<div class="rp-money"><div><span class="rp-hl">De business case</span><span class="rp-d">' + formatEuro(data.bizAnnual) + '</span>' +
          '<span class="sub">geschatte kosten per jaar, op basis van de eigen inschatting</span></div>' +
          '<div class="wait"><span class="sub" style="margin:0">Kosten van wachten</span><span class="rp-d">' + formatEuro(data.bizMonthly) + '</span><span class="sub">per maand</span></div></div>';
    }
    if (startWith.length) {
      html += '<div><h3 class="rp-h3">Hier begin je mee</h3></div><div class="rp-top">' +
        startWith.map((x, i) =>
          '<div class="rp-top-row"><span class="rp-d">' + String(i + 1).padStart(2, "0") + '</span><div><b>' + escapeHtml(x.item.titel) + '</b>' +
          '<small>' + escapeHtml(x.theme.naam) + ' &middot; ' + (g.quickwin.includes(x) ? "Quick win" : "Groot project") + '</small>' +

      '</div>' +
      '<div class="rp-bars">' + themeRows.map((r, idx) => {
        const pct = r.n / r.t.items.length * 100;

    // 4. Prioriteiten op de matrix ------------------------------------
    const matrixHtml =
      '<div class="rp-matrix-wrap"><div class="rp-matrix">' +
        '<div class="rp-q q1"><b>Quick wins</b><span>Hoge impact, lage inspanning</span></div>' +
        '<div class="rp-q q2"><b>Grote projecten</b><span>Hoge impact, hoge inspanning</span></div>' +
        '<div class="rp-q q3"><b>Nice to have</b><span>Lage impact, lage inspanning</span></div>' +
        '<div class="rp-q q4"><b>Heroverwegen</b><span>Lage impact, hoge inspanning</span></div>' +
        '<div class="rp-matrix-v"></div><div class="rp-matrix-h"></div>' +
        ordered.map(x => {
          const p = state.placements[x.key];
          return '<span class="rp-mark rq-' + x.q + '" style="left:' + p.xPct + '%;top:' + p.yPct + '%">' + nr[x.key] + '</span>';
        }).join("") +
      '</div><span class="rp-axis-x">Inspanning om te realiseren &rarr;</span><span class="rp-axis-y">Impact op de organisatie &rarr;</span></div>';
    const legend = ordered.map(x =>
      '<div class="rp-legend-row">' + mark(x.key, x.q) + '<span>' + escapeHtml(x.item.titel) + ' <small>&middot; ' + escapeHtml(x.theme.naam) + '</small></span><span class="q">' + Q_LABEL[x.q] + '</span></div>');
    const unplaced = Array.from(state.flagged).filter(k => !state.placements[k]).map(k => findItem(k)).filter(Boolean);
    if (unplaced.length) {
      legend.push('<p class="rp-note" style="margin-top:3mm">Nog niet geprioriteerd: ' + unplaced.map(f => escapeHtml(f.item.titel)).join(", ") + '.</p>');
    }
    section("Prioriteiten", "Jouw prioriteiten",
      "Zo heb je de pijnpunten op de matrix gezet. De nummers komen in de rest van dit rapport terug.",
      [matrixHtml].concat(legend));

    // 5. Business case -------------------------------------------------
    if (data.bizAnnual > 0) {
      const p5 = newPage("", "Business case");
      const months = [1, 3, 6, 12];
      const max = data.bizMonthly * 12;
      bodyOf(p5).innerHTML = secHead("De business case", "Wat kosten de gevonden knelpunten vandaag? Geen benchmark, maar je eigen inschatting. Daarmee is het jouw getal.") +
        '<div class="rp-big-money"><span class="nshape" data-n></span><div><span class="rp-hl">Geschatte kosten per jaar</span><span class="rp-d">' + formatEuro(data.bizAnnual) + '</span>' +
          '<span class="sub">aan tijd die nu in de gevonden knelpunten gaat zitten: zo\'n ' + formatHours(state.bizHours * 52) + ' per jaar</span></div></div>' +
        '<div><h3 class="rp-h3">Zo kom je aan dit bedrag</h3></div>' +
        '<div class="rp-formula">' +
          '<div class="rp-f"><span class="rp-d">' + String(state.bizHours).replace(".", ",") + '</span><span>uur per week</span></div><span class="rp-op">&times;</span>' +
          '<div class="rp-f"><span class="rp-d">52</span><span>weken per jaar</span></div><span class="rp-op">&times;</span>' +
          '<div class="rp-f"><span class="rp-d">' + formatEuro(state.bizRate) + '</span><span>uurtarief (bruto)</span></div><span class="rp-op">=</span>' +
          '<div class="rp-f res"><span class="rp-d">' + formatEuro(data.bizAnnual) + '</span><span>per jaar</span></div>' +
        '</div>' +
        '<div><h3 class="rp-h3">Wat kost uitstel?</h3><p class="rp-note" style="margin-top:1mm">Elke maand dat de knelpunten blijven liggen, lopen de kosten op.</p></div>' +
        '<div class="rp-wait">' + months.map(m =>
          '<div class="rp-wait-row"><span>' + (m === 1 ? "1 maand" : m + " maanden") + '</span>' +
          '<span class="rp-wait-track"><span class="rp-wait-fill" style="width:' + (data.bizMonthly * m / max * 100) + '%"></span></span>' +
          '<b>' + formatEuro(data.bizMonthly * m) + '</b></div>').join("") + '</div>' +
        '<p class="rp-note" style="margin-top:auto !important;margin-bottom:6mm">Dit is een inschatting op basis van de cijfers die je zelf hebt ingevuld. Indirecte kosten zoals fouten, herstelwerk, verloop of compliance-risico\'s zijn niet meegerekend; de werkelijke impact ligt daarom eerder hoger dan lager.</p>';
      addGraphics(p5);
    }

    // 6. Roadmap ---------------------------------------------------------
    const phase = (cls, num, title, when, items, emptyText) =>
      '<div class="rp-phase ' + cls + '"><div><span class="rp-phase-num">' + num + '</span><span class="rp-phase-t">' + title + '</span><span class="rp-phase-w">' + when + '</span></div>' +
      (items.length
        ? '<ul>' + items.map(x => '<li>' + mark(x.key, x.q) + '<span>' + escapeHtml(x.item.titel) + '<small>' + escapeHtml(x.theme.naam) + '</small></span></li>').join("") + '</ul>'
        : '<p class="empty">' + emptyText + '</p>') + '</div>';
    const withQ = (arr, q) => arr.map(x => Object.assign({ q }, x));
    const roadmapBlocks = [
      phase("p1", "01", "Quick wins", "Deze maand", withQ(g.quickwin, "quickwin"), "Geen quick wins geplaatst."),
      phase("p2", "02", "Grote projecten", "Dit kwartaal", withQ(g.project, "project"), "Geen grote projecten geplaatst."),
      phase("p3", "03", "Nice to have", "Wanneer het past", withQ(g.nice, "nice"), "Niets in deze fase."),
    ];
    if (g.reconsider.length) roadmapBlocks.push(phase("p4", "&ndash;", "Bewust geparkeerd", "Heroverwegen", withQ(g.reconsider, "reconsider"), ""));
    section("Roadmap", "De roadmap", "Niet alles hoeft in &eacute;&eacute;n keer. Dit is een haalbare volgorde, met de snelste waarde voorop.", roadmapBlocks);

    // 7. Aanbevelingen in detail ------------------------------------------
    const itemCard = (x, q) =>
      '<div class="rp-item rq-' + q + '">' +
        '<div class="rp-item-top">' + mark(x.key, q) + '<small>' + escapeHtml(x.theme.naam) + ' &middot; ' + Q_LABEL[q] + '</small></div>' +
        '<div class="rp-item-title">' + escapeHtml(x.item.titel) + '</div>' +
        '<div class="rp-item-grid">' +
          '<div><span class="rp-label"><span class="material-symbols-outlined" aria-hidden="true">error</span>Klopt nu nog niet</span><span class="now">&ldquo;' + escapeHtml(x.item.stelling) + '&rdquo;</span></div>' +
          '<div><span class="rp-label"><span class="material-symbols-outlined" aria-hidden="true">lightbulb</span>Oplossing</span>' + escapeHtml(x.item.oplossing) + '</div>' +
          '<div><span class="rp-label"><span class="material-symbols-outlined" aria-hidden="true">trending_up</span>Waarde</span>' + escapeHtml(x.item.waarde) + '</div>' +
        '</div>' +

    if (g.quickwin.length) {

  // "Download als PDF": elke rapportpagina wordt 1-op-1 omgezet naar een A4-pagina
  // in een echt PDF-bestand (html2canvas + jsPDF, ingebouwd in dit bestand).
  // Zo is het resultaat altijd gelijk, ongeacht browser, printer of printinstellingen.
  const pdfOverlay = $("#pdfOverlay");
  const pdfProgress = $("#pdfProgress");

  // SVG's worden los van de stylesheet gerenderd: kleuren uit CSS daarom als attribuut vastzetten.
  function inlineSvgColors(root) {
    $$("svg path, svg circle, svg rect", root).forEach(el => {
      const cs = getComputedStyle(el);
      if (cs.fill && cs.fill !== "none") el.setAttribute("fill", cs.fill);
      if (cs.stroke && cs.stroke !== "none") el.setAttribute("stroke", cs.stroke);
    });
  }

  function pdfFileName() {
    const safe = (state.client || "jouw organisatie").replace(/[\\/:*?"<>|]+/g, "").trim() || "jouw organisatie";
    return "Groeiverhaal - " + safe + ".pdf";
  }

  // In de lichte (Apps Script-)versie zitten de PDF-bibliotheken niet ingebouwd;
  // ze worden pas geladen bij de eerste PDF-download.
  const PDF_LIBS = [
    ["html2canvas", ["https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js", "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"]],
    ["jspdf", ["https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"]],
  ];
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = src; s.async = true; s.crossOrigin = "anonymous";
      s.onload = resolve; s.onerror = () => reject(new Error("Kon " + src + " niet laden"));
      document.head.appendChild(s);
    });
  }
  async function loadPdfLibs() {
    for (const [globalName, urls] of PDF_LIBS) {
      if (window[globalName]) continue;
      let lastErr;
      for (const url of urls) {
        try { await loadScript(url); if (window[globalName]) { lastErr = null; break; } }
        catch (e) { lastErr = e; }
      }
      if (!window[globalName]) throw lastErr || new Error(globalName + " niet beschikbaar");
    }
  }

  function isAppsScript() {
    return typeof google !== "undefined" && !!google.script;
  }

  let pdfBlobUrl = null;
  function resetPdfOverlay() {
    $("#pdfSpinner").classList.remove("hidden");
    $("#pdfTitle").textContent = "PDF wordt gemaakt";
    $("#pdfReady").classList.add("hidden");
    if (pdfBlobUrl) { URL.revokeObjectURL(pdfBlobUrl); pdfBlobUrl = null; }
  }
  function showPdfReady(blob) {
    pdfBlobUrl = URL.createObjectURL(blob);
    const dl = $("#pdfDownloadLink");
    dl.href = pdfBlobUrl;
    dl.setAttribute("download", pdfFileName());
    $("#pdfOpenLink").href = pdfBlobUrl;
    $("#pdfSpinner").classList.add("hidden");
    $("#pdfTitle").textContent = "PDF is klaar";
    pdfProgress.textContent = pdfFileName();
    $("#pdfReady").classList.remove("hidden");
    dl.focus();
  }
  $("#pdfCloseBtn").addEventListener("click", () => { pdfOverlay.classList.add("hidden"); resetPdfOverlay(); });

  async function downloadPdf() {
    if (!state.decision) { askForDecision(); return; }
    if (!state.lead) { openLeadGate(); return; }
    const btn = $("#printBtn");
    if (!window.html2canvas || !window.jspdf) {
      try { await loadPdfLibs(); } catch (e) { console.error(e); printReport(); return; }
    }
    let keepOverlay = false;
    btn.disabled = true;
    resetPdfOverlay();
    pdfOverlay.classList.remove("hidden");
    pdfProgress.textContent = "Rapport opbouwen\u2026";
    try {
      try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { /* doorgaan */ }
      buildReport();
      reportEl.classList.add("capturing");
      inlineSvgColors(reportEl);
      const pages = $$(".rp-page", reportEl);
      const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", orientation: "portrait", compress: true });
      for (let i = 0; i < pages.length; i++) {
        pdfProgress.textContent = "Pagina " + (i + 1) + " van " + pages.length;
        await new Promise(r => setTimeout(r, 0)); // laat de voortgang zien
        const canvas = await window.html2canvas(pages[i], { scale: 2.5, backgroundColor: "#FFFFFF", logging: false, useCORS: true });
        if (i > 0) pdf.addPage("a4", "portrait");
        pdf.addImage(canvas.toDataURL("image/jpeg", 0.88), "JPEG", 0, 0, 210, 297, undefined, "FAST");
      }
      pdf.setProperties({ title: "Groeiverhaal - " + (state.client || ""), author: "Nmbrs", subject: "Groeiverhaal", creator: "Nmbrs Groeiversneller" });
      if (isAppsScript()) {
        // In een Google Apps Script-webapp draait de pagina in een afgeschermd kader;
        // daar is een download via een aangeklikte link het betrouwbaarst.
        showPdfReady(pdf.output("blob"));
        keepOverlay = true;
      } else {
        pdf.save(pdfFileName());
        showToast("PDF gedownload: " + pdfFileName());
      }
    } catch (err) {
      console.error(err);
      showToast("PDF maken lukte niet; het printvenster wordt geopend. Kies daar 'Opslaan als PDF'.");
      printReport();
    } finally {
      reportEl.classList.remove("capturing");
      if (!keepOverlay) pdfOverlay.classList.add("hidden");
      btn.disabled = false;
    }
  }

  async function printReport() {
    if (!state.decision || !state.lead) { requestPdf(); return; }
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { /* doorgaan */ }
    buildReport();
    window.print();
  }
  // Ook bij Ctrl/Cmd+P altijd een actueel rapport.
  // Zonder achtergelaten gegevens blijft het rapport leeg (de print toont dan niets).
  window.addEventListener("beforeprint", () => { if (state.client && state.lead) buildReport(); else reportEl.innerHTML = ""; });

  // ---------------------------------------------------------------
  // INIT
  // ---------------------------------------------------------------
  function init() {
    $$("[data-logo]").forEach(el => { el.innerHTML = logoSvg(el.dataset.logo); });
    $$("[data-n]").forEach(el => { el.innerHTML = nshapeSvg(); });
    captureBron();
    if (window.CAMPAGNE_BEELD) $("#campagneBeeld").src = window.CAMPAGNE_BEELD;
    else $("#campagneFiguur").classList.add("hidden");
    buildThemeNav();
    initStart();
    showView("start");
    clientInput.focus();
    window.__GV_KLAAR = true;
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();
window.__GV_EINDE_APP = true;
</script>
